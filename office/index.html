<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>مكتب الثقة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: زميل بالمحل، واضح وهادي
   IDEA: مكتب حقيقي من فوق متل bimbly، كل موظف على طاولته باسمه ووظيفته
   PICTURE: أرضية خشب وشبابيك، طاولة اجتماع بالنص و4 طاولات، بتكبس على الموظف
   COLOUR and TYPE: أزرق الثقة + خشب دافي + أخضر للحالة، خط Cairo
   LAYOUT: عنوان وزر الاجتماع، المشهد، اجتماع الصبح، بدو موافقتك، تفاصيل الموظف */
:root{color-scheme:light dark;--bg:light-dark(#eef3fa,#0b1626);--ink:light-dark(#0e1e33,#e8eef7);--mut:light-dark(#53647c,#93a4bb);--card:light-dark(#fff,#13233a);--line:light-dark(#d6e0ee,#22364f);--blue:#1f5fbf;--sky:#3fa9f5;--warn:#f08a24;--ok:#1aa36f;--floor:light-dark(#f3e6d3,#2a2219);--plank:light-dark(#e8d6bd,#332a1f);--wall:light-dark(#ffffff,#16263d)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Cairo,Tahoma,sans-serif;overflow-x:clip}
.band{padding:clamp(16px,4vw,40px) max(4vw,14px);max-width:1100px;margin:auto}
h1{font-size:clamp(26px,5vw,40px);line-height:1.1;margin:0;font-weight:800}
h2{font-size:20px;margin:0 0 10px}
.top{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;font-size:14px;color:var(--mut)}
.chip{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:2px 12px;display:inline-flex;gap:6px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut);display:inline-block;flex:none}.dot.on{background:var(--ok)}
.scene{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.scene svg{display:block;width:100%;height:auto}
.desk{cursor:pointer;outline:none}.desk:focus-visible .tag,.desk.sel .tag{stroke:var(--blue);stroke-width:3}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-top:14px}
.meta{font-size:14px;color:var(--mut);margin:0 0 8px}
.sum{font-size:17px;margin:0 0 12px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.st{background:var(--bg);border-radius:12px;padding:10px 12px}.st b{display:block;font-size:21px;white-space:nowrap}.st span{font-size:13px;color:var(--mut)}.st.w b{color:var(--warn)}
.cal{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px}
.cal li{display:flex;gap:10px;align-items:baseline}.cal time{font-weight:800;color:var(--blue);white-space:nowrap;min-width:3.6em}
.ap{border-top:1px solid var(--line);padding:12px 0;display:grid;gap:8px}.ap:first-of-type{border-top:0;padding-top:0}
.ap .who{font-size:13px;color:var(--mut)}.ap .t{font-weight:700}
.ap pre{white-space:pre-wrap;font:15px/1.6 Cairo,sans-serif;background:var(--bg);border-radius:12px;padding:10px 12px;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap}
button,a.btn{font:600 15px Cairo,sans-serif;min-height:44px;border-radius:12px;border:0;background:var(--blue);color:#fff;cursor:pointer;padding:0 16px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
button.ghost,a.ghost{background:var(--bg);color:var(--blue);border:1px solid var(--line)}
a.wa{background:#1aa36f}
button:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:2px}button:disabled{opacity:.6}
.emp-head{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:800;font-size:20px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.col h3{font-size:15px;margin:0 0 6px;color:var(--mut)}.col ul{margin:0;padding-inline-start:18px}.col li{margin-bottom:4px}
.empty{color:var(--mut);font-size:14px}
.badge{display:inline-block;font-size:13px;border-radius:99px;padding:2px 10px;font-weight:700}.badge.ok{background:#e3f6ee;color:#11724c}.badge.wait{background:#fff1e0;color:#a85a0c}.badge.no{background:#fde7ea;color:#a3283c}.res{font-size:14px;overflow-wrap:anywhere}
.say{background:var(--bg);border-radius:14px;padding:12px 14px;margin:0 0 12px;font-size:16px;border-inline-start:4px solid var(--blue)}
.login{max-width:380px;margin:20px auto;display:flex;flex-direction:column;gap:12px}
.login input{font:16px Cairo,sans-serif;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px}
.msg{font-size:14px;min-height:1.3em;margin:0}.err{color:var(--warn)}
[hidden]{display:none!important}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
</style>
</head>
<body>
<main class="band">
 <div class="top">
  <div>
   <h1>مكتب شركة الثقة</h1>
   <div class="chips"><span class="chip">٧ موظفين + المؤسس</span><span class="chip"><span class="dot" id="dot"></span><span id="state">عم يفتح…</span></span></div>
  </div>
  <div class="row"><button id="run" hidden>ابدأ اجتماع الصبح هلق</button></div>
 </div>
 <p class="msg" id="runMsg" aria-live="polite"></p>

 <form class="card login" id="login" hidden>
  <h2>تسجيل الدخول</h2>
  <p class="meta">نفس الإيميل وكلمة السر تبع برنامج المحاسبة.</p>
  <input id="em" type="email" autocomplete="username" placeholder="الإيميل" dir="ltr" required>
  <input id="pw" type="password" autocomplete="current-password" placeholder="كلمة السر" dir="ltr" required>
  <button id="go" type="submit">دخول</button>
  <p class="msg err" id="lerr" aria-live="polite"></p>
 </form>

 <div id="app" hidden>
 <div class="scene">
  <svg viewBox="0 0 900 890" role="group" aria-label="المكتب: اكبس على أي موظف">
   <defs>
    <pattern id="wood" width="900" height="36" patternUnits="userSpaceOnUse"><rect width="900" height="36" fill="var(--floor)"/><rect y="34" width="900" height="2" fill="var(--plank)"/><rect x="180" width="2" height="36" fill="var(--plank)"/><rect x="610" width="2" height="36" fill="var(--plank)"/></pattern>
    <g id="dk"><ellipse cx="0" cy="66" rx="98" ry="12" fill="#000" opacity=".1"/><rect x="-90" y="10" width="180" height="56" rx="10" fill="#c99c6b"/><rect x="-90" y="10" width="180" height="10" rx="5" fill="#ddb787"/><rect x="-34" y="-30" width="68" height="42" rx="5" fill="#1b2a40"/><rect x="-29" y="-25" width="58" height="31" rx="3" fill="#3fa9f5" opacity=".85"/><rect x="-6" y="12" width="12" height="5" fill="#1b2a40"/></g>
    <g id="dkf"><ellipse cx="0" cy="70" rx="130" ry="13" fill="#000" opacity=".12"/><rect x="-122" y="10" width="244" height="60" rx="12" fill="#8b5a2b"/><rect x="-122" y="10" width="244" height="12" rx="6" fill="#a8703a"/><rect x="-40" y="-32" width="80" height="46" rx="5" fill="#1b2a40"/><rect x="-35" y="-27" width="70" height="35" rx="3" fill="#ffd36b" opacity=".9"/><rect x="-6" y="14" width="12" height="5" fill="#1b2a40"/></g>
    <g id="pl"><rect x="-12" y="-4" width="24" height="26" rx="5" fill="#b9805a"/><circle cx="0" cy="-16" r="16" fill="#2f9e5b"/><circle cx="-10" cy="-8" r="10" fill="#38b46a"/><circle cx="10" cy="-6" r="10" fill="#2b8f52"/></g>
   </defs>
   <rect width="900" height="890" fill="url(#wood)"/>
   <rect width="900" height="86" fill="var(--wall)"/>
   <g fill="#bfe3fb" stroke="#9fb8cc" stroke-width="3"><rect x="40" y="12" width="150" height="60" rx="4"/><rect x="230" y="12" width="150" height="60" rx="4"/><rect x="520" y="12" width="150" height="60" rx="4"/><rect x="710" y="12" width="150" height="60" rx="4"/></g>
   <g stroke="#9fb8cc" stroke-width="3"><path d="M115 12v60M305 12v60M595 12v60M785 12v60"/></g>
   <text x="450" y="52" text-anchor="middle" font-family="Cairo,sans-serif" font-weight="800" font-size="22" fill="var(--blue)">شركة الثقة</text>
   <use href="#pl" x="40" y="140"/><use href="#pl" x="860" y="140"/><use href="#pl" x="270" y="160"/><use href="#pl" x="630" y="160"/><use href="#pl" x="420" y="790"/><use href="#pl" x="480" y="800"/><use href="#pl" x="40" y="870"/><use href="#pl" x="860" y="870"/>
   <g transform="translate(450 590)"><ellipse cx="0" cy="44" rx="120" ry="16" fill="#000" opacity=".1"/><ellipse cx="0" cy="18" rx="112" ry="44" fill="#ddb787"/><ellipse cx="0" cy="12" rx="112" ry="40" fill="#e8c79d"/><text y="20" text-anchor="middle" font-family="Cairo,sans-serif" font-size="20" font-weight="700" fill="#7a5532">طاولة الاجتماع</text></g>
   <g id="desks"></g>
  </svg>
 </div>

 <section class="card" id="standup" aria-labelledby="sh">
  <h2 id="sh">اجتماع الصبح</h2>
  <p class="meta" id="when"></p>
  <p class="sum" id="sum"></p>
  <div class="stats" id="stats"></div>
  <ul class="cal" id="cal"></ul>
 </section>

 <section class="card" aria-labelledby="ah">
  <h2 id="ah">بدو موافقتك <span class="meta" id="apn"></span></h2>
  <div id="aps"></div>
 </section>

 <section class="card" id="emp" aria-live="polite"></section>

 <div class="foot">
  <button class="ghost" id="ref">تحديث</button>
  <a class="btn ghost" id="toClaude" href="https://claude.ai/artifact/LiPDiQmpg2zD84KePzSQMU" target="_blank" rel="noopener" hidden>افتح المكتب بـClaude (تشغيل الاجتماع)</a>
  <button class="ghost" id="out" hidden>تسجيل خروج</button>
 </div>
 </div>
</main>
<script>
{
const SB={url:'https://ecvzyptrpekgsouhgbdb.supabase.co',key:'sb_publishable_UpaManLT8I-L0lcQi53BaQ_Y52DzNpt'};
const PROJECT='ecvzyptrpekgsouhgbdb',TRIG='trig_015rp7dfYK3ehfXaGggnGbV6',RT='thiqa-office-rt';
const TEAM=[
 {k:'founder',n:'عبد السلام',r:'المؤسس',c:'#b8860b',x:450,y:155,f:1},
 {k:'accountant',n:'خالد',r:'المحاسب',c:'#7b4fd0',x:150,y:355},
 {k:'gm',n:'مازن',r:'المدير العام',c:'#1f5fbf',x:450,y:355},
 {k:'sales',n:'سامر',r:'مدير المبيعات',c:'#d6455d',x:750,y:355},
 {k:'warehouse',n:'عمر',r:'أمين المستودع',c:'#8a6a3b',x:150,y:555},
 {k:'marketing',n:'لينا',r:'التسويق والترويج',c:'#f08a24',x:750,y:555},
 {k:'driver',n:'أبو علي',r:'السائق',c:'#3c7d8f',x:150,y:755},
 {k:'pr',n:'ريم',r:'العلاقات العامة',c:'#1aa36f',x:750,y:755}];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:1});
const LS={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
let REP=null,SEL='gm',mcp=null,ACTS=[];const EXEC='trig_01S7krAy6W87bgMt9yDMTTgS';

$('desks').innerHTML=TEAM.map(t=>`<g class="desk" data-k="${t.k}" tabindex="0" role="button" aria-label="${esc(t.n+' – '+t.r)}" transform="translate(${t.x} ${t.y})">
 <circle cx="0" cy="-58" r="17" fill="#f2c7a2"/><path d="M-17 -62a17 17 0 0 1 34 0q-5-12-17-12t-17 12z" fill="#3b2a20"/>
 <rect x="-24" y="-40" width="48" height="44" rx="18" fill="${t.c}"/>
 <use href="${t.f?'#dkf':'#dk'}"/>
 <circle id="lamp-${t.k}" cx="40" cy="-70" r="7" fill="#93a4bb"/>
 <rect class="tag" x="-125" y="78" width="250" height="44" rx="22" fill="${t.f?'#fff4d6':'var(--wall)'}" stroke="${t.f?'#d9a441':'var(--line)'}"/>
 <text y="108" fill-opacity="1" text-anchor="middle" font-family="Cairo,sans-serif" font-size="22" fill="${t.f?'#5a3d00':'var(--ink)'}"><tspan font-weight="800">${esc(t.n)}</tspan> · ${esc(t.r)}</text></g>`).join('');
document.querySelectorAll('.desk').forEach(g=>{const f=()=>{SEL=g.dataset.k;renderEmp();$('emp').scrollIntoView({behavior:'smooth',block:'start'})};g.addEventListener('click',f);g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f()}})});

const arr=v=>Array.isArray(v)?v:[];
const waNum=p=>{let d=String(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('0'))d='963'+d.slice(1);else if(d.length===9&&d.startsWith('9'))d='963'+d;return d.length>=11?d:''};
const kind=a=>{const t=String(a.type||'').toLowerCase();if(['whatsapp','calendar','post','ad','task'].includes(t))return t;if(a.phone||a.to)return 'whatsapp';const x=String(a.title||'');if(/بوست|ستوري|منشور/.test(x))return 'post';if(/إعلان|اعلان/.test(x))return 'ad';return 'task'};
const linkify=t=>esc(t).replace(/https:\/\/[^\s<"']+/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
let SAVE=null;
async function decide(x,dec){if(!REP)return;const ty=kind(x.a),rec={report_id:REP.id,agent:x.m.k,idx:x.idx,item:Object.assign({},x.a,{type:ty}),decision:dec,status:(dec==='approved'&&ty!=='whatsapp'&&ty!=='task')?'pending':'manual'};
 ACTS.push(Object.assign({},rec,{result:''}));render();
 try{await SAVE(rec);$('runMsg').textContent=rec.status==='pending'?(mcp?'وصلت موافقتك، والموظف عم ينفّذ هلق. بيوصلك إشعار لما يخلص.':'وصلت موافقتك، والموظف بينفّذها خلال ساعة بالدوام.'):dec==='approved'?'انحفظت موافقتك.':'انحفظ رفضك، وما رح يعيدوا يقترحوه.'}
 catch(e){ACTS=ACTS.filter(y=>!(y.agent===rec.agent&&+y.idx===rec.idx));render();$('runMsg').textContent='ما انحفظ القرار، جرّب كمان مرة.'}}
function render(){
 const r=REP&&REP.data||{};
 if(!REP){$('when').textContent='لسا ما صار ولا اجتماع. أول اجتماع بيصير الصبح الساعة 8:47.';$('sum').textContent='';$('stats').innerHTML='';$('cal').innerHTML='';$('aps').innerHTML='<p class="empty">ما في شي هلق.</p>';$('apn').textContent='';renderEmp();return}
 const t=new Date(REP.created_at);
 $('when').textContent='آخر اجتماع: '+t.toLocaleString('ar-SY',{weekday:'long',day:'numeric',month:'numeric',hour:'numeric',minute:'2-digit'});
 $('sum').textContent=r.summary||'';
 const s=r.stats||{},st=(v,l,w)=>`<div class="st${w?' w':''}"><b>${esc(v)}</b><span>${esc(l)}</span></div>`;
 $('stats').innerHTML=st('$'+num(Math.round(s.owed||0)),'ديون عند '+num(s.debtors)+' زبون')+st(num(s.inv_n)+' / $'+num(s.inv_sum),'فواتير آخر يوم')+st('$'+num(s.cash_usd_in||0)+(s.cash_syp_in?' + '+num(s.cash_syp_in)+' ل.س':''),'دخل الصندوق آخر يوم')+st(num(s.stale!=null?s.stale:s.due),'متأخرين +30 يوم',(s.stale||s.due)>0);
 $('cal').innerHTML=arr(r.calendar).map(c=>`<li><time>${esc(c.time)}</time><span>${esc(c.title)}</span></li>`).join('');
 const A=r.agents||{},list=[];
 TEAM.forEach(m=>arr(A[m.k]&&A[m.k].approve).forEach((a,idx)=>list.push({m,a,idx})));
 $('apn').textContent=list.length?'('+list.length+')':'';
 $('aps').innerHTML=list.length?list.map(({m,a,idx},i)=>{const w=waNum(a.phone),ty=kind(a),act=ACTS.find(x=>x.agent===m.k&&+x.idx===idx);
  const lab={whatsapp:'رسالة واتساب',calendar:'موعد بالكالندر',post:'بوست',ad:'إعلان (تجهيز بس)',task:'مهمة إلك'}[ty];
  let st='';if(act){st=act.decision==='rejected'?'<span class="badge no">رفضت</span>':act.status==='pending'?'<span class="badge wait">وافقت · عم يتنفّذ…</span>':act.status==='failed'?'<span class="badge no">ما زبط</span>':'<span class="badge ok">وافقت ✓</span>';if(act.result)st+=`<div class="res">${linkify(act.result)}</div>`}
  const btns=act?(act.decision==='approved'&&ty==='whatsapp'&&w&&a.msg?`<a class="btn wa" href="https://wa.me/${w}?text=${encodeURIComponent(a.msg)}" target="_blank" rel="noopener">افتح بالواتساب</a>`:''):
   `${ty==='whatsapp'&&w&&a.msg?`<a class="btn wa" data-ok="${i}" href="https://wa.me/${w}?text=${encodeURIComponent(a.msg)}" target="_blank" rel="noopener">موافق، افتح بالواتساب</a>`:`<button data-ok="${i}">موافق</button>`}<button class="ghost" data-no="${i}">رفض</button>`;
  return`<div class="ap"><div class="who">${esc(m.n)} · ${esc(m.r)} · ${lab}${a.to?' ← '+esc(a.to):''}</div><div class="t">${esc(a.title)}</div>${a.msg?`<pre>${esc(a.msg)}</pre>`:''}${st}<div class="row">${btns}${a.msg?`<button class="ghost" data-copy="${i}">نسخ</button>`:''}</div></div>`}).join(''):'<p class="empty">ما في شي بدو موافقتك هلق.</p>';
 $('aps').querySelectorAll('[data-ok]').forEach(b=>b.addEventListener('click',()=>decide(list[+b.dataset.ok],'approved')));
 $('aps').querySelectorAll('[data-no]').forEach(b=>b.addEventListener('click',()=>decide(list[+b.dataset.no],'rejected')));
 $('aps').querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>copy(list[+b.dataset.copy].a.msg,b)));
 const open=x=>!ACTS.find(y=>y.agent===x.m.k&&+y.idx===x.idx);TEAM.forEach(m=>{const l=$('lamp-'+m.k);if(l)l.setAttribute('fill',list.some(x=>open(x)&&(m.f||x.m.k===m.k))?'#f08a24':'#1aa36f')});$('apn').textContent=list.filter(open).length?'('+list.filter(open).length+' ناطرين)':'';
 renderEmp();
}
function renderEmp(){
 document.querySelectorAll('.desk').forEach(g=>g.classList.toggle('sel',g.dataset.k===SEL));
 const m=TEAM.find(t=>t.k===SEL),A=(REP&&REP.data&&REP.data.agents)||{},a=A[SEL]||{};
 const head=`<div class="emp-head"><div class="av" style="background:${m.c}">${esc(m.n[0])}</div><div><h2 style="margin:0">${esc(m.n)}</h2><div class="meta" style="margin:0">${esc(m.r)}</div></div></div>`;
 if(m.f){let n=0;TEAM.forEach(t=>n+=arr(A[t.k]&&A[t.k].approve).length);
  $('emp').innerHTML=head+`<p class="sum" style="margin:0 0 8px">هاد مكتبك. الفريق بيشتغل، والقرار إلك.</p><p class="meta">${REP?(n?`عندك ${n} شي بدهن قرارك، تحت «بدو موافقتك».`:'ما في شي بدو قرارك هلق.'):'بس يصير أول اجتماع بتطلع قراراتك هون.'}</p>${REP&&REP.data.summary?`<div class="say">«${esc(REP.data.summary)}» <span class="meta">— مازن</span></div>`:''}`;return}
 const col=(h,v)=>`<div class="col"><h3>${h}</h3>${arr(v).length?'<ul>'+arr(v).map(x=>`<li>${esc(typeof x==='string'?x:x.title||JSON.stringify(x))}</li>`).join('')+'</ul>':'<p class="empty">ما في</p>'}</div>`;
 $('emp').innerHTML=head+(REP&&A[SEL]?`${a.say?`<div class="say">«${esc(a.say)}»</div>`:''}<div class="cols">${col('شو عملت مبارح',a.done)}${col('شو لازم ينعمل اليوم',a.today)}${col('المشاكل',a.issues)}</div>${a.plan?`<h3 style="font-size:15px;margin:14px 0 6px;color:var(--mut)">خطة الأسبوع</h3><pre style="white-space:pre-wrap;font:15px/1.6 Cairo,sans-serif;margin:0">${esc(a.plan)}</pre>`:''}`:'<p class="empty">بيطلع شغله هون من أول اجتماع للفريق الجديد.</p>');
}
async function copy(t,b){try{await navigator.clipboard.writeText(t)}catch(e){const x=document.createElement('textarea');x.value=t;document.body.appendChild(x);x.select();try{document.execCommand('copy')}catch(_){}x.remove()}const o=b.textContent;b.textContent='انتسخ ✓';setTimeout(()=>b.textContent=o,1500)}
function ok(t){$('dot').classList.add('on');$('state').textContent=t}
function bad(t){$('dot').classList.remove('on');$('state').textContent=t}

/* --- داخل Claude --- */
function parseSql(p){const txt=typeof p==='string'?p:(p&&p.result)||JSON.stringify(p);const m=String(txt).match(/<untrusted-data-[^>]+>\s*([\s\S]*?)\s*<\/untrusted-data/);return JSON.parse(m?m[1]:txt)}
const fmtT=t=>t?new Date(t).toLocaleString('ar-SY',{weekday:'short',hour:'numeric',minute:'2-digit'}):'';
function startClaude(){
 $('app').hidden=false;$('run').hidden=false;
 const q="select r.id, r.created_at, r.data, coalesce((select json_agg(json_build_object('agent',a.agent,'idx',a.idx,'decision',a.decision,'status',a.status,'result',a.result)) from office_actions a where a.report_id=r.id),'[]'::json) acts from office_reports r order by r.created_at desc limit 1";
 const load=()=>mcp.callTool('Supabase','execute_sql',{project_id:PROJECT,query:q}).then(res=>{const rows=parseSql(res.payload);REP=rows[0]||null;ACTS=REP?arr(REP.acts):[];render();ok('متصل بالمكتب')}).catch(()=>bad('ما قدرت إقرا التقارير هلق'));
 load();$('ref').onclick=load;
 SAVE=async rec=>{const j=JSON.stringify(rec.item).split('$act$').join('');const sql=`insert into public.office_actions (report_id,agent,idx,item,decision,status) values (${+rec.report_id},'${rec.agent.replace(/[^a-z]/g,'')}',${+rec.idx},$act$${j}$act$::jsonb,'${rec.decision==='approved'?'approved':'rejected'}','${rec.status==='pending'?'pending':'manual'}') on conflict do nothing`;
  await mcp.callTool('Supabase','execute_sql',{project_id:PROJECT,query:sql});
  if(rec.status==='pending'){try{await mcp.callTool('Claude Code Remote','fire_trigger',{trigger_id:EXEC})}catch(e){}setTimeout(load,90000);setTimeout(load,180000)}};
 mcp.watchTool('Claude Code Remote','list_triggers',{limit:50},ev=>{
  if(ev.type!=='data')return;const t=arr(ev.result.payload&&ev.result.payload.data).find(x=>x.id===TRIG);if(!t)return;
  const lr=t.last_run,run=lr&&/RUN|PEND|QUEUE/.test(lr.status||'');
  $('runMsg').textContent=run?'الفريق عم يجتمع هلق… بس يخلصوا بتتحدّث الصفحة.':(t.next_run_at?'الاجتماع الجاي: '+fmtT(t.next_run_at):'');
  if(!run&&$('run').dataset.wait==='1'){$('run').dataset.wait='';load()}
 },{refetchInterval:30000});
 $('run').onclick=async()=>{const b=$('run');b.disabled=true;$('runMsg').textContent='عم بنادي الفريق…';
  try{await mcp.callTool('Claude Code Remote','fire_trigger',{trigger_id:TRIG});b.dataset.wait='1';$('runMsg').textContent='بلّش الاجتماع. بياخد كم دقيقة، وبيوصلك إشعار لما يخلص.'}
  catch(e){$('runMsg').textContent='ما زبط هلق، جرّب كمان شوي.'}finally{setTimeout(()=>b.disabled=false,60000)}};
}

/* --- برّا Claude (GitHub والتطبيق) --- */
let tok=null,exp=0;
async function auth(body,grant){const r=await fetch(SB.url+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json().catch(()=>({}));if(!r.ok||!j.access_token)throw Object.assign(new Error('auth'),{code:r.status>=500?'net':'auth'});tok=j.access_token;exp=Date.now()+(j.expires_in||3600)*1000-60000;LS.set(RT,j.refresh_token||null)}
async function token(){if(tok&&Date.now()<exp)return tok;const rt=LS.get(RT);if(!rt)throw Object.assign(new Error('login'),{code:'auth'});await auth({refresh_token:rt},'refresh_token');return tok}
function showLogin(m){$('app').hidden=true;$('login').hidden=false;$('lerr').textContent=m||'';bad('سجّل دخول')}
async function webLoad(){
 $('state').textContent='عم يجيب التقرير…';
 try{const t=await token();const r=await fetch(SB.url+'/rest/v1/office_reports?select=id,created_at,data&order=created_at.desc&limit=1',{headers:{apikey:SB.key,Authorization:'Bearer '+t}});
  if(r.status===401||r.status===403)throw Object.assign(new Error('auth'),{code:'auth'});if(!r.ok)throw Object.assign(new Error('net'),{code:'net'});
  const rows=await r.json();REP=rows[0]||null;ACTS=[];if(REP){const r2=await fetch(SB.url+'/rest/v1/office_actions?select=agent,idx,decision,status,result&report_id=eq.'+REP.id,{headers:{apikey:SB.key,Authorization:'Bearer '+t}});if(r2.ok)ACTS=await r2.json()}$('login').hidden=true;$('app').hidden=false;render();ok('متصل · '+new Date().toLocaleTimeString('ar-SY',{hour:'numeric',minute:'2-digit'}))}
 catch(e){if(e.code==='auth'){LS.set(RT,null);tok=null;showLogin()}else{bad('ما في إنترنت هلق');if(!LS.get(RT))showLogin()}}
}
function startWeb(){
 SAVE=async rec=>{const t=await token();const r=await fetch(SB.url+'/rest/v1/office_actions',{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+t,'Content-Type':'application/json',Prefer:'resolution=ignore-duplicates,return=minimal'},body:JSON.stringify(rec)});if(!r.ok&&r.status!==409)throw new Error('save')};
 $('toClaude').hidden=false;$('out').hidden=false;$('ref').onclick=webLoad;
 $('login').addEventListener('submit',async ev=>{ev.preventDefault();const b=$('go');b.disabled=true;$('lerr').textContent='';
  try{await auth({email:$('em').value.trim(),password:$('pw').value},'password');$('pw').value='';await webLoad()}
  catch(e){$('lerr').textContent=e.code==='net'?'في مشكلة بالاتصال، جرّب كمان شوي':'الإيميل أو كلمة السر غلط'}finally{b.disabled=false}});
 $('out').onclick=()=>{LS.set(RT,null);tok=null;showLogin()};
 if(LS.get(RT))webLoad();else showLogin();
}

renderEmp();
const WEB=/(^|\.)github\.io$/.test(location.hostname)||location.protocol==='file:'||location.hostname==='localhost';
if(WEB)startWeb();
else{
 const noMcp=()=>{$('app').hidden=false;render();bad('افتح الصفحة من حسابك على Claude')};
 let tries=0;const go=()=>{if(window.claude&&typeof window.claude.use==='function')window.claude.use('mcp').then(m=>{if(m){mcp=m;startClaude()}else noMcp()},noMcp);else if(++tries<20)setTimeout(go,250);else noMcp()};go();
}
}
