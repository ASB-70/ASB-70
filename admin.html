<style>

label{display:block;font-weight:700;margin:10px 0 3px;font-size:14px}
button{font-family:inherit;cursor:pointer}
.box{max-width:430px;margin:30px auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px}

.er{color:var(--rd);font-weight:700;margin-top:8px;font-size:14px}

.tabs button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;font-size:15px;font-weight:700}
.tabs button.on{background:var(--pr);color:#fff;border-color:var(--pr)}

.cd{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:8px 0}
.gd{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center}
.st b{display:block;font-size:26px;color:var(--pr)}
.pr{display:flex;gap:10px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;margin:7px 0}
.pr img,.pr .ni{width:62px;height:62px;object-fit:contain;background:#fff;border-radius:8px;flex:none}
.pr .ni{display:flex;align-items:center;justify-content:center;color:var(--mu);font-size:11px;border:1px dashed var(--bd)}
.pr .x{flex:1;min-width:0}
.cs{font-weight:800;color:var(--pr);direction:ltr;display:inline-block}
.pc{color:var(--ac);font-weight:800;direction:ltr;display:inline-block}
.tg{display:inline-block;font-size:11px;border-radius:6px;padding:1px 7px;margin-inline-start:4px;background:var(--pr);color:#fff}
.tg.h{background:var(--rd)}.tg.s{background:#b45309}
.ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.ac button{padding:6px 10px;font-size:13px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fr .w2{grid-column:1/-1}
.ov{position:fixed;inset:0;background:#000a;z-index:20}
.ov[hidden],.ts[hidden],#app[hidden]{display:none}
.pn{position:absolute;bottom:0;inset-inline:0;max-width:640px;margin:auto;background:var(--bg);color:var(--tx);border-radius:16px 16px 0 0;max-height:94%;overflow:auto;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.ph2{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:18px}
.ts{position:fixed;bottom:24px;inset-inline:0;margin:auto;width:max-content;max-width:90%;background:#000d;color:#fff;border-radius:20px;padding:9px 16px;z-index:30;font-size:14px}
.bar{height:9px;background:var(--bd);border-radius:6px;overflow:hidden}.bar div{height:100%;background:var(--ac)}
.gr{display:grid;grid-template-columns:100px 1fr auto;gap:8px;align-items:center;margin:6px 0}
.pv{max-width:140px;max-height:140px;border-radius:8px;background:#fff;display:block;margin:6px 0}
.wn{background:#fff7ed;border:1px solid #fdba74;color:#9a3412;border-radius:10px;padding:10px;margin:8px 0;font-size:14px}
@media (prefers-color-scheme:dark){.wn{background:#2a1c10;color:#fdba74}}
</style>
</head>
