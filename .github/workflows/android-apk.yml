name: Build Android APK (ملصق الأسعار)

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build signed APK
        run: gradle -p android-app assembleRelease --no-daemon --stacktrace

      - name: Put the APK on the site (labels/app/price-label.apk)
        run: |
          mkdir -p labels/app
          cp android-app/app/build/outputs/apk/release/app-release.apk labels/app/price-label.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add labels/app/price-label.apk
          git commit -m "تحديث ملف تطبيق أندرويد (APK)" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
