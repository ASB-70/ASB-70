name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle -p android assembleCustomerRelease assembleAdminRelease --no-daemon --stacktrace
      - name: Collect
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/customer/release/*.apk apk/altheqa.apk
          cp android/app/build/outputs/apk/admin/release/*.apk apk/altheqa-admin.apk
      - name: Commit APKs
        run: |
          git config user.name "apk-bot"
          git config user.email "apk-bot@users.noreply.github.com"
          git add apk
          git commit -m "APK build" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
