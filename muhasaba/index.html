<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#13265C"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>محاسبة شركة الثقة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: a ledger you operate with one thumb. Navy "cover" band carries the one number that matters, flat ruled rows below, fixed tab bar. */
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --sunk:#E3E8F1; --ink:#101B33; --muted:#5A6684; --line:#D6DDEA;
  --brand:#1C3FA0; --on-brand:#FFFFFF; --cover:#13265C; --cover-2:#1B367F; --on-cover:#F3F6FF; --on-cover-muted:#AEBBE0;
  --debt:#B3261E; --debt-bg:#FBE9E7; --credit:#0B7447; --credit-bg:#E2F4EA; --due:#8A5A00; --due-bg:#FCEFCF; --wa:#0E7A43; --on-wa:#FFFFFF;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif; --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A111F; --surface:#121B2E; --sunk:#0E1626; --ink:#E8EDF8; --muted:#94A1BE; --line:#24304B;
  --brand:#7C9DFF; --on-brand:#0A111F; --cover:#101D45; --cover-2:#182B63; --on-cover:#F3F6FF; --on-cover-muted:#9FAEDB;
  --debt:#FF8A80; --debt-bg:#3A1716; --credit:#5FD39A; --credit-bg:#0F2E20; --due:#F2C461; --due-bg:#33270B; --wa:#1FA35C; --on-wa:#04140B;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0A111F; --surface:#121B2E; --sunk:#0E1626; --ink:#E8EDF8; --muted:#94A1BE; --line:#24304B;
  --brand:#7C9DFF; --on-brand:#0A111F; --cover:#101D45; --cover-2:#182B63; --on-cover:#F3F6FF; --on-cover-muted:#9FAEDB;
  --debt:#FF8A80; --debt-bg:#3A1716; --credit:#5FD39A; --credit-bg:#0F2E20; --due:#F2C461; --due-bg:#33270B; --wa:#1FA35C; --on-wa:#04140B;
  color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;font-family:var(--display)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.cover{background:linear-gradient(160deg,var(--cover),var(--cover-2));color:var(--on-cover)}
.cover .wrap{padding-block:18px 22px;display:flex;flex-direction:column;gap:14px}
.eyebtn{border:1px solid var(--on-cover-muted);background:rgba(255,255,255,.1);color:var(--on-cover);border-radius:99px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}.eyebtn svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
body.priv #cover .big,body.priv #cover .trio b,body.priv #cover .eyebrow .num,body.priv #cover .totbar b,body.priv #v-home .bar b,body.priv #clist .sechead b{filter:blur(9px);user-select:none;-webkit-user-select:none;pointer-events:none}
.brandline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--on-cover-muted)}
.brandline b{font-family:var(--display);font-weight:600;color:var(--on-cover);font-size:14px}
.eyebrow{font-size:12.5px;color:var(--on-cover-muted)}
.big{font-family:var(--display);font-weight:700;font-size:clamp(34px,10vw,48px);line-height:1.1;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;text-align:right}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 10px;min-width:0}
.trio span{display:block;font-size:11.5px;color:var(--on-cover-muted)}
.trio b{font-family:var(--display);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
main.wrap{padding-block:16px 96px;display:flex;flex-direction:column;gap:18px}
h2{font-family:var(--display);font-weight:600;font-size:16px;margin:0;text-wrap:balance}
.sec{display:flex;flex-direction:column;gap:8px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sechead small{color:var(--muted);font-size:12.5px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-inline:0;border-top:0;text-align:right}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--sunk)}
.row .who{flex:1;min-width:0}
.row .who b{display:block;font-weight:600;overflow-wrap:anywhere}
.row .who small{color:var(--muted);font-size:12.5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .amt{text-align:left;flex:none}
.row .amt b{display:block;font-family:var(--display);font-weight:600;font-variant-numeric:tabular-nums;direction:ltr}
.row .amt small{color:var(--muted);font-size:11.5px}
.chip{display:inline-block;border-radius:99px;padding:1px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.c-debt{background:var(--debt-bg);color:var(--debt)} .c-credit{background:var(--credit-bg);color:var(--credit)}
.c-zero{background:var(--sunk);color:var(--muted)} .c-due{background:var(--due-bg);color:var(--due)}
.t-debt{color:var(--debt)} .t-credit{color:var(--credit)}
.bars{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:9px}
.bar{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.bar i{display:block;height:8px;border-radius:4px;background:var(--brand);min-width:3px}
.bar .track{background:var(--sunk);border-radius:4px}
.tools{display:flex;flex-direction:column;gap:8px}
.tools input[type=search],.field input,.field select,.field textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.tools .line{display:flex;gap:8px;flex-wrap:wrap}
.tools select{flex:1;min-width:120px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:7px 8px;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.btn.primary{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
.btn.wa{background:var(--wa);color:var(--on-wa);border-color:var(--wa)}
.btn.danger{color:var(--debt)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn[disabled]{opacity:.55;cursor:default}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.duecard{border-color:var(--due)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:26px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.back{background:none;border:0;color:var(--on-cover-muted);padding:0;font-size:14px;text-align:right}
.dname{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.3;overflow-wrap:anywhere}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:5;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(8,1fr);gap:0}
nav button{border:0;background:none;padding:7px 0;border-radius:10px;color:var(--muted);font-size:9.5px;min-width:0;white-space:nowrap;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
nav button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current=page]{color:var(--brand);font-weight:600;background:var(--sunk)}
nav .badge{position:absolute;top:2px;inset-inline-start:calc(50% + 6px);background:var(--debt);color:var(--surface);border-radius:99px;font-size:10.5px;min-width:17px;padding:0 4px;font-weight:700}
.fab{position:fixed;bottom:calc(74px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));z-index:6;border-radius:99px;box-shadow:0 6px 18px rgba(0,0,0,.25);padding:12px 18px}
.scrim{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted)}
.field textarea{min-height:120px;resize:vertical}
.it{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.it .full{grid-column:1/-1}.it .two{grid-column:span 2}
.it .lt{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.sug{display:flex;flex-wrap:wrap;gap:6px}.sug:empty{display:none}
.sug button{border:1px solid var(--line);background:var(--sunk);border-radius:99px;padding:6px 12px;font-size:13.5px}
.sug.rows{flex-direction:column}.sug.rows button{border-radius:10px;display:flex;gap:8px;align-items:center;text-align:right;width:100%}
.crow{display:grid;grid-template-columns:44px minmax(0,1fr) 76px 76px;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}.crow b{display:block;overflow-wrap:anywhere;font-weight:600;font-size:13.5px}.crow small{color:var(--muted);font-size:12px}
.crow input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 6px;text-align:center}
.crow.head{font-size:12px;color:var(--muted);background:var(--sunk);position:sticky;top:0}
.ctab{display:grid;grid-template-columns:1.2fr 1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:13.5px}
.ctab>*{padding:9px 12px;border-bottom:1px solid var(--line);min-width:0}.ctab>.h{background:var(--sunk);color:var(--muted);font-size:12.5px}.ctab>.l{color:var(--muted)}
.ctab>.n{font-family:var(--display);font-variant-numeric:tabular-nums;direction:ltr;text-align:right}.ctab>.t{font-weight:600;border-bottom:0;background:var(--sunk)}
.qamt{width:100%;font-family:var(--display);font-size:30px;font-weight:600;text-align:center;direction:ltr;background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:12px}
.qamt:focus{border-color:var(--brand);outline:0}
.qb{border:0;border-radius:12px;padding:16px 8px;font-family:var(--display);font-weight:600;font-size:17px}
.qb.in{background:var(--credit);color:var(--surface)}.qb.out{background:var(--debt-bg);color:var(--debt);padding:11px 8px;font-size:14.5px}
#cqn{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
#lock{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,var(--cover),var(--cover-2));color:var(--on-cover);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#lock img{background:#fff;border-radius:18px;padding:8px;object-fit:contain}
#lock form{display:flex;flex-direction:column;gap:10px;width:min(260px,100%)}
#lockpin{font-family:var(--display);font-size:28px;text-align:center;letter-spacing:.3em;direction:ltr;border-radius:12px;border:2px solid var(--on-cover-muted);background:rgba(255,255,255,.08);color:var(--on-cover);padding:12px;width:100%}
.syncpill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--on-cover-muted);white-space:nowrap;flex:none}
.syncpill i{width:8px;height:8px;border-radius:50%;background:#4ADE80;flex:none}.syncpill.s-off{color:#FCA5A5}.syncpill.s-off i{background:#F87171}.syncpill.s-sync i{background:#FBBF24}
@media (prefers-reduced-motion:no-preference){.syncpill.s-sync i{animation:blink 1s ease-in-out infinite}@keyframes blink{50%{opacity:.25}}}
.totbar{background:var(--cover);color:var(--on-cover);border-radius:12px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.totbar b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;direction:ltr}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;z-index:40;font-size:13.5px;max-width:90%;text-align:center}
.note{background:var(--due-bg);color:var(--due);border-radius:10px;padding:9px 12px;font-size:13px}
pre.msg{white-space:pre-wrap;font-family:var(--body);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0;font-size:13.5px;user-select:all}
@media (max-width:380px){.bar{grid-template-columns:60px 1fr auto}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<div dir="rtl" lang="ar" id="app">
  <header class="cover"><div class="wrap" id="cover"></div></header>
  <main class="wrap">
    <div id="notice" class="note" hidden></div>
    <section id="v-home" class="sec" style="gap:18px"></section>
    <section id="v-customers" class="sec" hidden>
      <div class="tools">
        <input type="search" id="q" placeholder="ابحث بالاسم أو الرقم أو المدينة" autocomplete="off">
        <div class="seg" id="typeseg" role="group" aria-label="طبيعة الحساب">
          <button type="button" data-type="all" aria-pressed="true">الكل</button>
          <button type="button" data-type="debt" aria-pressed="false">مدين</button>
          <button type="button" data-type="credit" aria-pressed="false">دائن</button>
          <button type="button" data-type="zero" aria-pressed="false">مسدَّد</button>
        </div>
        <div class="line">
          <select id="cityf" aria-label="المحافظة"></select>
          <select id="sortf" aria-label="الترتيب">
            <option value="bal">الأعلى ديناً</option><option value="name">حسب الاسم</option><option value="due">حسب موعد التذكير</option>
          </select>
        </div>
        <button class="btn sm" type="button" data-act="cimp-open">استيراد زبائن من إكسل</button>
      </div>
      <div id="clist"></div>
    </section>
    <section id="v-due" class="sec" style="gap:18px" hidden></section>
    <section id="v-staff" class="sec" style="gap:14px" hidden></section>
    <section id="v-emp" class="sec" style="gap:14px" hidden></section>
    <section id="v-reports" class="sec" style="gap:14px" hidden></section>
    <section id="v-cash" class="sec" style="gap:14px" hidden>
      <div class="card" id="cquick">
        <input class="qamt" id="cqa" type="number" inputmode="decimal" step="any" min="0" placeholder="0" aria-label="المبلغ" autocomplete="off">
        <div class="grid2"><button class="qb in" type="button" data-act="q-cash" data-dir="in" data-cur="syp">قبض ليرة</button><button class="qb in" type="button" data-act="q-cash" data-dir="in" data-cur="usd">قبض دولار</button></div>
        <div class="grid2"><button class="qb out" type="button" data-act="q-cash" data-dir="out" data-cur="syp">صرف ليرة</button><button class="qb out" type="button" data-act="q-cash" data-dir="out" data-cur="usd">صرف دولار</button></div>
        <input id="cqn" placeholder="بيان (اختياري)" aria-label="بيان الحركة" autocomplete="off">
      </div>
      <div id="cbody" class="sec" style="gap:14px"></div>
    </section>
    <section id="v-stock" class="sec" hidden>
      <div class="tools">
        <input type="search" id="sq" placeholder="ابحث في المخزون بالاسم أو الكود" autocomplete="off">
        <div class="seg" id="stseg" role="group" aria-label="حالة المخزون">
          <button type="button" data-st="all" aria-pressed="true">الكل</button><button type="button" data-st="in" aria-pressed="false">متوفر</button>
          <button type="button" data-st="out" aria-pressed="false">منتهي</button><button type="button" data-st="nocost" aria-pressed="false">بدون تكلفة</button>
        </div>
      </div>
      <div id="slist"></div>
    </section>
    <section id="v-settings" class="sec" style="gap:14px" hidden></section>
    <section id="v-detail" class="sec" style="gap:16px" hidden></section>
  </main>
  <button class="btn primary fab" id="fab" type="button" data-act="new-customer">＋ زبون جديد</button>
  <nav aria-label="الأقسام"><div class="in">
    <button type="button" data-view="home"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z"/><path d="M9 20v-6h6v6"/></svg>الرئيسية</button>
    <button type="button" data-view="customers"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.5 3.2-5.5 6.5-5.5s5.900 2 6.500 5.500"/><path d="M16 5a3.300 3.300 0 010 6.500M18 14.500c2 .700 3.200 2.500 3.600 5.500"/></svg>الزبائن</button>
    <button type="button" data-view="cash"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><circle cx="12" cy="12.5" r="2.5"/><path d="M6 9.500v.01M18 15.500v.01"/></svg>الصندوق</button>
    <button type="button" data-view="stock"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>المخزون</button>
    <button type="button" data-view="staff"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.500" r="3.500"/><path d="M5 20c.700-4 3.500-6 7-6s6.300 2 7 6"/></svg>الموظفون</button>
    <button type="button" data-view="reports"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>التقارير</button>
    <button type="button" data-view="due"><svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 21h4"/></svg>التذكيرات<span class="badge" id="duebadge" hidden></span></button>
    <button type="button" data-view="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>الإعدادات</button>
  </div></nav>
  <div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" hidden></div>

function stmtPDF(cv){ // A4 pages, each holding a slice of the statement image cut on a row boundary
  const W=cv.width,PH=Math.round(W*841.89/595.28),s0=cv._rs,RH=cv._rh,re=cv._re,cuts=[];let y=0;
  while(cv.height-y>PH){let c=y+PH;if(c<re)c=s0+Math.floor((c-s0)/RH)*RH;else if(y<re)c=re;if(c<=y)c=y+PH;cuts.push([y,c]);y=c}
  cuts.push([y,cv.height]);
  const enc=new TextEncoder(),parts=[],offs=[];let len=0;
  const push=d=>{const u=typeof d==='string'?enc.encode(d):d;parts.push(u);len+=u.length};
  const obj=(n,body)=>{offs[n]=len;push(n+' 0 obj\n');body();push('\nendobj\n')};
  push('%PDF-1.4\n');const N=cuts.length;
  obj(1,()=>push('<</Type/Catalog/Pages 2 0 R>>'));
  obj(2,()=>push('<</Type/Pages/Count '+N+'/Kids['+cuts.map((_,i)=>(3+i*3)+' 0 R').join(' ')+']>>'));
  cuts.forEach(([a,b],i)=>{const h=b-a,pc=document.createElement('canvas');pc.width=W;pc.height=h;const g=pc.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,h);g.drawImage(cv,0,a,W,h,0,0,W,h);
    const bin=atob(pc.toDataURL('image/jpeg',0.92).split(',')[1]),jpg=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)jpg[k]=bin.charCodeAt(k);
    const p=3+i*3,hh=h*595.28/W,cs='q 595.28 0 0 '+hh.toFixed(2)+' 0 '+(841.89-hh).toFixed(2)+' cm /Im0 Do Q';
    obj(p,()=>push('<</Type/Page/Parent 2 0 R/MediaBox[0 0 595.28 841.89]/Resources<</XObject<</Im0 '+(p+2)+' 0 R>>>>/Contents '+(p+1)+' 0 R>>'));
    obj(p+1,()=>push('<</Length '+cs.length+'>>\nstream\n'+cs+'\nendstream'));
    obj(p+2,()=>{push('<</Type/XObject/Subtype/Image/Width '+W+'/Height '+h+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+jpg.length+'>>\nstream\n');push(jpg);push('\nendstream')})});
  const xo=len,cnt=3+N*3;push('xref\n0 '+cnt+'\n0000000000 65535 f \n');
  for(let n=1;n<cnt;n++)push(String(offs[n]).padStart(10,'0')+' 00000 n \n');
  push('trailer\n<</Size '+cnt+'/Root 1 0 R>>\nstartxref\n'+xo+'\n%%EOF');
  return new Blob(parts,{type:'application/pdf'});
}

   <div class="field"><label for="lf-n">${f.type==='exp'?'البيان (مثال: مصروف البيت)':f.type==='adv'||f.type==='advcut'||f.type==='draw'?'البيان (مثال: بضاعة، نقدية)':f.type==='leave'?'السبب':f.type==='ot'?'البيان (مثال: 3 ساعات)':'البيان (مثال: تأخر ساعة)'}</label><input id="lf-n" data-lf="n" value="${esc(f.n)}"></div>
   <div class="grid2"><button class="btn primary" type="submit">حفظ</button><button class="btn" type="button" data-act="close">إلغاء</button></div></form>`;$('#scrim').hidden=false}
async function saveLog(){const f=S.lf,e=emp(S.eid);if(!f||!e)return;const l={id:newId(),type:f.type,d:f.d||today(),n:(f.n||'').trim()};
  if(f.type==='leave'){l.kind=f.kind;l.paid=String(f.paid)==='true';l.days=nv(f.days);if(!(l.days>0)){toast('أدخل عدد الأيام');return}}
  else{l.cur=f.cur;l.a=r2(nv(f.a));if(!(l.a>0)){toast('أدخل المبلغ');return}if(nv(f.h)>0){l.h=nv(f.h);if(!l.n)l.n=(Math.round(l.h*100)/100)+' ساعة'+(f.tm?(f.type==='ot'?' · خرج ':' · حضر ')+f.tm:'')}}
  if(f.type==='advcut'){const bal=advBal(e)[l.cur];if(l.a>bal+0.005){toast('المبلغ أكبر من السلف المتبقية ('+cm(l.cur,bal)+')');return}}
  if((f.type==='adv'||f.type==='exp')&&String(f.cashout)==='true')l.cash=l.d;
  await S.db.doc('staff/'+e.id).update({log:[...(e.log||[]),l]});
  if(l.cash){await cashAdd(l.cash,[{id:newId(),t:new Date().toISOString(),dir:'out',cur:l.cur,a:l.a,n:(f.type==='exp'?'مصروف ':'سلفة ')+e.name,ltx:l.id,staff:e.id}])}
  S.lf=null;closeSheet();toast(l.cash?'سُجّل وخرج من الصندوق':'سُجّلت')}
function paySheet(){const e=emp(S.eid);if(!e)return;const ws=S.ews||wkStart(today()),r=weekCalc(e,ws);
  openSheet(`<h2>دفع راتب ${esc(e.name)}</h2><span class="small muted">أسبوع <span class="num">${dmy(ws)}</span> إلى <span class="num">${dmy(addDays(ws,5))}</span>. المتبقي له: <b class="num">${money(r.rem.usd)}</b> و <b class="num">${sy(r.rem.syp)}</b>.</span>
   <form id="payform"><div class="grid2"><div class="field"><label for="pay-u">المدفوع بالدولار ($)</label><input id="pay-u" type="number" step="any" min="0" inputmode="decimal" value="${r.rem.usd>0?r.rem.usd:''}"></div>
   <div class="field"><label for="pay-s">المدفوع بالليرة (ل.س)</label><input id="pay-s" type="number" step="any" min="0" inputmode="decimal" value="${r.rem.syp>0?r.rem.syp:''}"></div></div>
   <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="pay-cash" checked style="width:18px;height:18px"> يخرج من الصندوق اليومي كمصروف</label>
   <div class="grid2"><button class="btn primary" type="submit">تأكيد الدفع</button><button class="btn" type="button" data-act="close">إلغاء</button></div></form>`)}
async function savePay(){const e=emp(S.eid);if(!e)return;const usd=r2(nv($('#pay-u').value)),syp=r2(nv($('#pay-s').value));if(!(usd>0)&&!(syp>0)){toast('أدخل المبلغ المدفوع');return}
  const day=today(),l={id:newId(),type:'pay',d:day,w:S.ews||wkStart(day),usd,syp,n:''};if($('#pay-cash').checked)l.cash=day;
  await S.db.doc('staff/'+e.id).update({log:[...(e.log||[]),l]});
  if(l.cash){const t=new Date().toISOString(),n='راتب '+e.name,L=[];if(usd>0)L.push({id:newId(),t,dir:'out',cur:'usd',a:usd,n,ltx:l.id,staff:e.id});if(syp>0)L.push({id:newId(),t,dir:'out',cur:'syp',a:syp,n,ltx:l.id,staff:e.id});await cashAdd(day,L)}
  closeSheet();toast(l.cash?'دُفع الراتب وخرج من الصندوق':'سُجّل دفع الراتب')}

/* ---------- reports: sales, expenses, safe daily spending, invoice register ---------- */
S.rep={inv:null,cash:null,per:'month',q:'',err:false,loading:false};
function loadReports(force){if(!S.db||S.rep.loading)return;if(!force&&S.rep.inv&&S.rep.cash)return;S.rep.loading=true;S.rep.err=false;staffSub();
  const all=c=>EXT?S.db.collection(c).get():S.db.collection(c).limit(1000).get();Promise.all([all('invoices'),all('cash')]).then(([a,b])=>{
    S.rep.inv=a.docs.map(d=>({id:d.id,...d.data()}));S.rep.cash=b.docs.map(d=>({id:d.id,...d.data()}));S.rep.loading=false;if(S.view==='reports')renderReports()
  }).catch(e=>{S.rep.loading=false;S.rep.err=e&&e.code||e&&e.message||true;if(S.view==='reports')renderReports()})}
function repRange(per){const t=today();if(per==='day')return[t,t];if(per==='week'){const w=wkStart(t);return[w,addDays(w,6)]}if(per==='month')return[t.slice(0,7)+'-01',t.slice(0,7)+'-31'];return['0000-00-00','9999-99-99']}
function staffLogType(){const m={};for(const e of S.staff)for(const l of e.log||[])m[l.id]=l.type;return m}
function expCat(t,lt){if(t.dir!=='out'||t.pair||t.cid)return null;
  if(t.staff||t.ltx){const k=lt[t.ltx]||((t.n||'').startsWith('سلفة')?'adv':(t.n||'').startsWith('مصروف')?'exp':'pay');return k==='adv'?'adv':k==='exp'?'own':'sal'}return'oth'}
function repCalc(lo,hi){const R=S.rep,lt=staffLogType(),o={sales:0,cashSales:0,credit:0,profit:0,n:0,noCost:0,exp:{sal:0,own:0,oth:0,adv:0},noRate:false};
  for(const v of R.inv){const d=v.date||'';if(d<lo||d>hi)continue;o.n++;o.sales+=nv(v.total);if(v.pay==='نقدي')o.cashSales+=nv(v.total);else o.credit+=nv(v.total);if(v.profit==null)o.noCost++;else o.profit+=nv(v.profit)}
  for(const day of R.cash){const d=day.id||day.date||'';if(d<lo||d>hi)continue;const rate=nv(day.rate)||nv(S.settings.rate);
    for(const t of day.tx||[]){const c=expCat(t,lt);if(!c)continue;let u=t.cur==='usd'?nv(t.a):rate>0?nv(t.a)/rate:0;if(t.cur!=='usd'&&!(rate>0))o.noRate=true;o.exp[c]+=u}}
  o.expTot=o.exp.sal+o.exp.own+o.exp.oth;return o}
function renderReports(){const el=$('#v-reports'),R=S.rep;
  if(!S.db){el.innerHTML='<div class="empty">جارٍ التحميل…</div>';return}
  if(R.err&&!R.inv){el.innerHTML=`<div class="empty"><b>تعذّر تحميل التقارير</b><span>تحقق من الاتصال ثم أعد المحاولة.${R.err!==true?` <small class="num">(${esc(R.err)})</small>`:''}</span></div><button class="btn primary" type="button" data-act="rep-reload">إعادة المحاولة</button>`;return}
  if(!R.inv||!R.cash){el.innerHTML='<div class="empty">جارٍ حساب التقارير…</div>';return}
  const [lo,hi]=repRange(R.per),c=repCalc(lo,hi),T=today(),per={day:'اليوم',week:'هذا الأسبوع',month:'هذا الشهر',all:'الكل'};
  const seg=`<div class="seg" role="group" aria-label="الفترة">${Object.keys(per).map(k=>`<button type="button" data-act="rep-per" data-p="${k}" aria-pressed="${R.per===k}">${per[k]}</button>`).join('')}</div>`;
  const net=r2(c.profit-c.expTot);
  // safe daily spending: average gross profit per working day (Sat-Thu) over the last 30 days
  const firstD=R.inv.reduce((m,v)=>v.date&&v.profit!=null&&(!m||v.date<m)?v.date:m,''),from=addDays(T,-29),st=firstD&&firstD>from?firstD:from;
  let wd=0;for(let d=st;d<=T;d=addDays(d,1)){if(new Date(d+'T12:00:00').getDay()!==5)wd++}wd=Math.max(wd,1);
  const w=repCalc(st,T),avgP=r2(w.profit/wd),avgOper=r2((w.exp.sal+w.exp.oth)/wd),avgExp=r2(w.expTot/wd),own=r2(avgP-avgOper),td=repCalc(T,T);
  const ok=avgExp<=avgP+0.005;
  const inv=R.inv.filter(v=>{const q=nrm(R.q);return!q||nrm(v.no).includes(q)||nrm(v.cname).includes(q)||String(v.total).includes(q)}).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||String(b.no).localeCompare(String(a.no),'en',{numeric:true}));
  el.innerHTML=`<div class="sechead"><h2>المبيعات والمصاريف</h2><button class="btn sm" type="button" data-act="rep-reload">تحديث</button></div>${seg}
   <div class="ctab" style="grid-template-columns:1.6fr 1fr"><span class="h">${per[R.per]}</span><span class="h"></span>
    <span class="l">إجمالي المبيعات (${c.n} فاتورة)</span><span class="n"><b>${money(r2(c.sales))}</b></span>
    <span class="l">· نقدي</span><span class="n">${money(r2(c.cashSales))}</span>
    <span class="l">· آجل (على الذمم)</span><span class="n">${money(r2(c.credit))}</span>
    <span class="l">ربح المبيعات</span><span class="n t-credit">${money(r2(c.profit))}</span>
    <span class="l">إجمالي المصاريف</span><span class="n t-debt"><b>${money(r2(c.expTot))}</b></span>
    <span class="l">· رواتب الموظفين</span><span class="n">${money(r2(c.exp.sal))}</span>
    <span class="l">· مسحوبات الإدارة</span><span class="n">${money(r2(c.exp.own))}</span>
    <span class="l">· مصاريف أخرى</span><span class="n">${money(r2(c.exp.oth))}</span>
    <span class="l t">الصافي (الربح − المصاريف)</span><span class="n t ${net<0?'t-debt':'t-credit'}">${money(net)}</span></div>
   <span class="small muted">المصاريف تؤخذ من الصندوق اليومي (الليرة تُحوَّل بسعر صرف اليوم). السلف المدفوعة للموظفين (${money(r2(c.exp.adv))}) لا تُحسب مصروفاً لأنها تُخصم لاحقاً. التصريف وما يخص الزبائن لا يُحسب.${c.noCost?` ${c.noCost} فاتورة بلا تكلفة معروفة لا تدخل في الربح.`:''}${c.noRate?' بعض مصاريف الليرة بلا سعر صرف فلم تُحسب.':''}</span>
   <div class="card"><div class="sechead"><b>كم مصروفي اليومي حتى لا أخسر؟</b><small>آخر ${wd} يوم عمل</small></div>
    ${w.profit>0?`<div class="trio" style="grid-template-columns:1fr 1fr"><div style="background:var(--sunk)"><span style="color:var(--muted)">متوسط ربح اليوم</span><b class="num" style="color:var(--ink)">${money(avgP)}</b></div><div style="background:var(--sunk)"><span style="color:var(--muted)">متوسط مصاريفك اليوم</span><b class="num" style="color:var(--ink)">${money(avgExp)}</b></div></div>
    <div class="${ok?'chip c-credit':'note'}" style="text-align:center;padding:9px">${ok?'مصاريفك ضمن الحد الآمن':'مصاريفك أعلى من ربحك. أنت تخسر بمعدل '+money(r2(avgExp-avgP))+' باليوم'}</div>
    <div class="list"><div class="row"><span class="who"><b>الحد الأعلى للمصاريف كلها باليوم</b><small>أي أكثر منه = خسارة</small></span><span class="amt"><b>${money(avgP)}</b></span></div>
     <div class="row"><span class="who"><b>مصروفك الشخصي الآمن باليوم</b><small>بعد الرواتب والمصاريف الأخرى (${money(avgOper)} باليوم)</small></span><span class="amt"><b class="${own<0?'t-debt':'t-credit'}">${money(own)}</b></span></div>
     <div class="row"><span class="who"><b>مصروفك الشخصي المريح</b><small>يترك 20% من الربح للشركة</small></span><span class="amt"><b>${money(Math.max(0,r2(avgP*0.8-avgOper)))}</b></span></div>
     <div class="row"><span class="who"><b>اليوم</b><small>ربح ${money(r2(td.profit))} · مصاريف ${money(r2(td.expTot))}</small></span><span class="amt"><b class="${r2(avgP-td.expTot)<0?'t-debt':'t-credit'}">${money(r2(avgP-td.expTot))}</b><small>المتبقي من الحد</small></span></div></div>
    <span class="small muted">الحساب: متوسط الربح اليومي من فواتير آخر 30 يوماً (السبت إلى الخميس) حسب تكلفة المواد المسجلة بالمخزون. يتحسن كلما زادت الفواتير المسجلة.</span>`
    :`<div class="empty">لا توجد فواتير بربح معروف في آخر 30 يوم. سجّل تكلفة المواد في المخزون وأنشئ فواتير ليظهر الحساب.</div>`}</div>
   <div class="sec"><div class="sechead"><h2>سجل الفواتير</h2><small id="repcnt">${inv.length}</small></div>
    <div class="field"><label for="rep-q">بحث برقم الفاتورة أو اسم الزبون أو المبلغ</label><input id="rep-q" type="search" value="${esc(R.q)}" inputmode="search" autocomplete="off"></div>
    <div id="replist">${repInvList(inv)}</div></div>`}
function repInvList(inv){return inv.length?`<div class="list">${inv.slice(0,60).map(v=>`<button class="row" type="button" data-act="rep-inv" data-id="${esc(v.id)}" data-cid="${esc(v.cid||'')}"><span class="who"><b>فاتورة <span class="num">#${esc(v.no)}</span> · ${esc(v.cname||'')}</b><small><span class="num">${dmy(v.date)}</span><span>${esc(v.pay||'')}</span></small></span><span class="amt"><b class="num">${money(nv(v.total))}</b></span></button>`).join('')}</div>${inv.length>60?'<span class="small muted">يظهر أحدث 60 فاتورة. اكتب في البحث لتضييق النتائج.</span>':''}`:'<div class="empty">لا توجد فواتير مطابقة.</div>'}

/* ---------- backup, restore, PIN ---------- */
const BCOLS=['customers','ledgers','invoices','cash','staff','pimg','meta','settings'];
const bmsg=t=>{const m=$('#bkmsg');if(m)m.textContent=t};
async function doBackup(){const out={app:'thiqa-accounting',v:1,at:new Date().toISOString(),data:{},truncated:[]};
  for(const c of BCOLS){bmsg('جارٍ تجهيز النسخة… '+c);const s=await S.db.collection(c).limit(1000).get();out.data[c]=s.docs.map(d=>({id:d.id,d:d.data()}));if(s.docs.length>=1000)out.truncated.push(c)}
  const n=Object.values(out.data).reduce((a,l)=>a+l.length,0);bmsg('');
  try{await S.dl.save({filename:'نسخة احتياطية محاسبة الثقة '+today()+'.json',data:JSON.stringify(out)})}catch(er){if(er&&er.code!=='declined')toast('تعذّر تنزيل الملف هنا');return}
  S.settings={...S.settings,lastBackup:today()};try{await S.db.doc('settings/main').set(S.settings)}catch(e){}
  renderSettings();toast('نُزّلت النسخة: '+n+' سجل'+(out.truncated.length?' (بعض الأقسام أكبر من الحد)':''))}
function readRestore(file){const r=new FileReader();r.onerror=()=>toast('تعذّرت قراءة الملف');r.onload=()=>{const box=$('#rbox');if(!box)return;let o;try{o=JSON.parse(r.result)}catch(e){o=null}

  S.rest=o;S.armed=null;const n=BCOLS.reduce((a,c)=>a+((o.data[c]||[]).length),0);
  box.innerHTML=`<div class="note">نسخة بتاريخ <b class="num">${dmy((o.at||'').slice(0,10))}</b>: ${(o.data.customers||[]).length} زبون، ${(o.data.invoices||[]).length} فاتورة، ${(o.data.staff||[]).length} موظف، ${n} سجل بالمجموع.</div><button class="btn danger" type="button" data-act="restore">استرجاع هذه النسخة</button><span class="small" id="rmsg"></span>`};r.readAsText(file)}
async function doRestore(){const o=S.rest;if(!o)return;const ok=/^[A-Za-z0-9_\-.~:@+]{1,200}$/,jobs=[];for(const c of BCOLS)for(const x of o.data[c]||[])if(x&&ok.test(x.id||'')&&x.d&&typeof x.d==='object')jobs.push([c+'/'+x.id,x.d]);
  const m=$('#rmsg');let n=0;for(const [p,d] of jobs){for(let k=0;;k++){try{await S.db.doc(p).set(d);break}catch(e){if(k>=3)throw e;await new Promise(r=>setTimeout(r,1500*(k+1)))}}n++;if(m&&n%5===0)m.textContent=`جارٍ الاسترجاع ${n} من ${jobs.length}… لا تغلق الصفحة`}
  S.rest=null;if(m)m.textContent='';toast('اكتمل الاسترجاع: '+n+' سجل. أغلق البرنامج وافتحه من جديد.')}

const nrm=s=>String(s??'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/\s+/g,' ').trim().toLowerCase();
function colKind(h,whNames){const t=nrm(h);if(!t)return null;
  if(/كود|code|رمز/.test(t))return'code';
  if(/صور|image|photo/.test(t))return'img';
  if(/تكلف|كلفه|كلفة|راس المال|شراء|cost/.test(t))return'cost';
  if(/سعر|price/.test(t))return /طرد|كرتون/.test(t)?'p2':'price';
  if(/تعبئ|pack|داخل الطرد|بالطرد/.test(t))return'pack';
  if(/وحده|وحدة|unit/.test(t))return'unit';
  if(/اقل كميه|اقل كمية|حد ادني/.test(t))return'min';
  if(whNames.some(n=>nrm(n)===t)||/^مستودع/.test(t))return'wh';
  if(/كميه|كمية|مخزون|جرد|عدد|رصيد|qty|stock|quantity/.test(t))return'qty';
  if(/وصف|اسم|ماده|مادة|بيان|صنف|name|item|desc/.test(t))return'name';
  return null}
function parseBook(X,data,type,whNames){

    for(let i=0;i<Math.min(rows.length,20);i++){const kinds=(rows[i]||[]).map(h=>typeof h==='string'?colKind(h,whNames):null);
      if(kinds.includes('code')&&kinds.filter(k=>k&&k!=='img'&&k!=='code').length>=1){best={sn,rows,hi:i,kinds,r0};break}}
    if(best)break}
  if(!best)return{error:'nohead'};
  const col={},whCols=[];best.kinds.forEach((k,j)=>{if(!k)return;if(k==='wh')whCols.push({j,name:String(best.rows[best.hi][j]).replace(/\s+/g,' ').trim()});else if(col[k]===undefined)col[k]=j});
  const toN=v=>{if(v==null||v==='')return null;const n=typeof v==='number'?v:parseFloat(String(v).replace(/,/g,''));return isFinite(n)?n:null};
  const items=[],seen={},dups=[];
  for(let i=best.hi+1;i<best.rows.length;i++){const r=best.rows[i]||[];let code=r[col.code];if(code==null||String(code).trim()==='')continue;code=String(code).trim();
    const num=k=>col[k]===undefined?null:toN(r[col[k]]),str=k=>{if(col[k]===undefined)return null;const v=r[col[k]];return v==null?null:String(v).replace(/\s+/g,' ').trim()||null};
    const name=str('name');if(name&&name.startsWith('مثال:'))continue;
    if(seen[code]){dups.push(code);let k=2;while(seen[code+'-'+k])k++;code=code+'-'+k}seen[code]=1;
    const wq={};for(const w of whCols){const n=toN(r[w.j]);if(n!==null)wq[w.name]=n}
    items.push({code,name,price:num('price'),p2:num('p2'),pack:num('pack'),unit:str('unit'),min:str('min'),qty:num('qty'),cost:num('cost'),wq,xr:best.r0+i+1})}
  return{sheet:best.sn,si:wb.SheetNames.indexOf(best.sn),col,whCols:whCols.map(w=>w.name),items,dups}}

  if(/رصيد|مبلغ|ذمه|ذمة|ديون|الدين|balance|باقي/.test(t))return'bal';
  if(/نوع البيع|ملاحظ|note/.test(t))return'note';
  if(/اسم|زبون|عميل|name|customer/.test(t))return'name';
  return null}

function backNeed(){return $('#lock').hidden&&(!$('#scrim').hidden||S.view!=='home')}
function navPush(){if(!EXT||BK.pop)return;history.pushState({d:++BK.d},'')}
function navSync(){if(!EXT)return;const need=backNeed();if(!need&&BK.d>0){const n=BK.d;BK.d=0;BK.ignore++;history.go(-n)}else if(need&&BK.d===0)history.pushState({d:++BK.d},'')}
function doBack(){
  if(!$('#scrim').hidden){
    if(S.picking&&S.draft){S.picking=false;renderInv();return}
    if(S.draft||S.count||(S.imp&&S.imp.items)){if(Date.now()-BK.at<2500){BK.at=0;closeSheet()}else{BK.at=Date.now();toast('اضغط رجوع مرة ثانية لإلغاء هذه الشاشة')}return}
    closeSheet();return}
  show({detail:'customers',emp:'staff'}[S.view]||'home')}
function onPop(e){BK.d=(e.state&&e.state.d)||0;if(BK.ignore>0){BK.ignore--;return}BK.pop=true;try{doBack()}finally{BK.pop=false}navSync()}
function checkUpdate(auto){if(!EXT||BUILD==='dev')return;fetch('version.txt?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{t=t.trim();if(!t||t===BUILD)return;
  let seen='';try{seen=sessionStorage.getItem('thiqa-upd')||''}catch(e){}
  if(auto&&seen!==t&&$('#scrim').hidden){try{sessionStorage.setItem('thiqa-upd',t)}catch(e){}location.replace(location.pathname+'?v='+encodeURIComponent(t));return}
  const n=$('#notice');n.innerHTML='يوجد تحديث جديد للبرنامج. <button class="btn sm" type="button" data-act="app-update">تحديث الآن</button>';n.hidden=false}).catch(()=>{})}
if(EXT){window.addEventListener('popstate',onPop);
  new MutationObserver(()=>{if(!$('#scrim').hidden)navPush();navSync()}).observe($('#scrim'),{attributes:true,attributeFilter:['hidden']});
  new MutationObserver(navSync).observe($('#lock'),{attributes:true,attributeFilter:['hidden']});
  checkUpdate(true);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkUpdate(false)})}
$('#locklogo').src=LOGO;if(EXT&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if(LK.pin)lockShow();
show('home');
(async()=>{
  const use=n=>window.claude&&window.claude.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  let db,dl;const notice=$('#notice');
  if(EXT){db=makeSbDb(netStat);window.addEventListener('offline',()=>netStat('off'));window.addEventListener('online',()=>{db.doc('settings/main').get().catch(()=>{})});dl=browserDl;S.db=db;S.dl=dl;
    for(;;){if(!db.signedIn())await loginShow();
      try{await db.doc('settings/main').get();break}
      catch(e){if(e.code==='auth'){db.logout();continue}
        notice.textContent=e.code==='no_table'?'قاعدة البيانات غير مجهزة بعد. شغّل كود الإعداد في Supabase مرة واحدة ثم أعد فتح الصفحة.':'تعذّر الاتصال بقاعدة البيانات. تحقق من الإنترنت ثم أعد فتح الصفحة.';notice.hidden=false;S.loaded=true;lockHide();refresh();return}}}
  else{[db,dl]=await Promise.all([use('db'),use('downloads')]);S.db=db;S.dl=dl}
  if(!db){if(LK.pin)lockShow();else lockHide();}
  if(!db){S.loaded=true;notice.textContent='تعذّر فتح الدفتر في هذا العرض. افتح الصفحة من حسابك في Claude.';notice.hidden=false;refresh();return}
  $('#fab').hidden=!(S.view==='home'||S.view==='customers');
  const timer=setTimeout(()=>{notice.textContent=S.loaded?'قد لا تكون البيانات محدّثة. تحقق من الاتصال.':'لم نصل إلى الدفتر بعد. تحقق من الاتصال.';notice.hidden=false},10000);
  db.collection('customers').limit(1000).onSnapshot(s=>{
    S.customers=s.docs.map(d=>({id:d.id,...d.data()}));S.loaded=true;
    if(!s.metadata.fromCache){clearTimeout(timer);notice.hidden=true}
    refresh()},()=>{clearTimeout(timer);S.loaded=true;notice.textContent='انقطع الاتصال بالدفتر. أعد فتح الصفحة لاحقاً.';notice.hidden=false;refresh()});
  db.doc('meta/products').get().then(s=>{if(s.exists)S.products=s.data().items||{};if(S.view==='stock')refresh()}).catch(()=>{});
  db.doc('meta/stock').onSnapshot(s=>{const v=s.exists?s.data():{};S.stock=v.items||{};S.wh=(v.wh&&v.wh.length)?v.wh:[MAINWH];S.stockMeta=v.lastCount?{lastCount:v.lastCount}:{};S.stockLoaded=true;if(S.view==='stock'&&$('#scrim').hidden)refresh()},()=>{S.stockLoaded=true});
  staffSub();
  db.doc('meta/stocklog').get().then(s=>{if(s.exists)S.slog=s.data().list||[]}).catch(()=>{});
  db.doc('settings/main').get().then(s=>{if(s.exists){S.settings={...DEF,...s.data()};renderCover();if(S.view==='settings')renderSettings();if(S.view==='home')refresh()}lockSync(S.settings.pin)}).catch(()=>{if(LK.pin)lockShow();else lockHide()});
  setInterval(()=>{if($('#scrim').hidden&&S.askSent===null&&S.view!=='settings'&&S.view!=='customers')refresh()},60000);
})();
</script>
