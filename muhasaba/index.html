.brandline{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:13px;color:var(--on-cover-muted)}

main.wrap{padding-block:16px 96px;display:flex;flex-direction:column;gap:18px}

.sechead small{color:var(--muted);font-size:12.5px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-inline:0;border-top:0;text-align:right}
.row:last-child{border-bottom:0}
button.row:hover{background:var(--sunk)}
.row .who{flex:1;min-width:0}
.row .who b{display:block;font-weight:600;overflow-wrap:anywhere}
.row .who small{color:var(--muted);font-size:12.5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row .amt{text-align:left;flex:none}

.chip{display:inline-block;border-radius:99px;padding:1px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.c-debt{background:var(--debt-bg);color:var(--debt)} .c-credit{background:var(--credit-bg);color:var(--credit)}
.c-zero{background:var(--sunk);color:var(--muted)} .c-due{background:var(--due-bg);color:var(--due)}
.t-debt{color:var(--debt)} .t-credit{color:var(--credit)}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.muted{color:var(--muted)} .small{font-size:12.5px}

.back{background:none;border:0;color:var(--on-cover-muted);padding:0;font-size:14px;text-align:right}
.dname{font-family:var(--display);font-weight:600;font-size:21px;line-height:1.3;overflow-wrap:anywhere}

  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(10,1fr);gap:0}
nav button{border:0;background:none;padding:7px 0;border-radius:10px;color:var(--muted);font-size:9.5px;letter-spacing:-.2px;min-width:0;white-space:nowrap;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}

nav .badge{position:absolute;top:2px;inset-inline-start:calc(50% + 6px);background:var(--debt);color:var(--surface);border-radius:99px;font-size:10.5px;min-width:17px;padding:0 4px;font-weight:700}
.role-sales nav button:not([data-view=sales]):not([data-view=cash]):not([data-view=customers]):not([data-view=settings]){display:none}.role-sales nav .in{grid-template-columns:repeat(4,1fr)}.role-sales #peye,.role-sales [data-act=pshow],.role-sales [data-act=pk-open],.role-sales #cquick .qb.out,.role-sales [data-act=cash-new][data-dir=out],.role-sales [data-act=cash-new][data-dir=wd]{display:none!important}

  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px}
.sheet>*,.sheet form>*{flex-shrink:0}
.sheet form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted)}
.field textarea{min-height:120px;resize:vertical}
.it{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.it .full{grid-column:1/-1}.it .two{grid-column:span 2}

<div dir="rtl" lang="ar" id="app">
  <header class="cover"><div class="wrap" id="cover"></div></header>
  <main class="wrap">
    <div id="notice" class="note" hidden></div>
    <section id="v-home" class="sec" style="gap:18px"></section>
    <section id="v-customers" class="sec" hidden>
      <div class="tools">
        <input type="search" id="q" placeholder="ابحث بالاسم أو الرقم أو المدينة" autocomplete="off">
        <div class="seg" id="typeseg" role="group" aria-label="طبيعة الحساب">
          <button type="button" data-type="all" aria-pressed="true">الكل</button>

const defRate=()=>nv((S.cash||{}).rate)||nv(S.settings.rate)||'';
function cashPlan(d,total){const cc=d.cashCur||'usd',rate=nv(d.cashRate)||nv(S.settings.rate);
  if(cc==='usd')return{ok:true,list:[{cur:'usd',a:total,usd:total}],rate};
  if(!(rate>0))return{ok:false,list:[],rate};
  if(cc==='syp')return{ok:true,list:[{cur:'syp',a:nv(d.cashSyp)>0?Math.round(nv(d.cashSyp)):Math.round(total*rate),usd:total}],rate};
  const u=Math.min(total,Math.max(0,r2(nv(d.cashUsd)))),rem=r2(total-u),L=[];if(u>0)L.push({cur:'usd',a:u,usd:u});if(rem>0)L.push({cur:'syp',a:nv(d.cashSyp)>0?Math.round(nv(d.cashSyp)):Math.round(rem*rate),usd:rem});return{ok:true,list:L,rate}}

  if(src==='syp'){if(rem>0&&nv(d.cashSyp)>0){d.cashRate=String(Math.round(nv(d.cashSyp)/rem*100)/100);const e=$('#in-cashRate');if(e)e.value=d.cashRate}}
  else{const rate=nv(d.cashRate);d.cashSyp=rate>0&&rem>0?String(Math.round(rem*rate)):'';const e=$('#in-cashSyp');if(e&&document.activeElement!==e)e.value=d.cashSyp}}

async function saveInvoice(){

  const items=d.items.filter(it=>(it.name||'').trim()||(it.code||'').trim()).map(it=>({code:(it.code||'').trim(),name:(it.name||'').trim(),pack:nv(it.pack),qty:nv(it.qty),unit:(it.unit||'').trim(),price:nv(it.price),cost:nv(it.cost)>0?nv(it.cost):nv((S.stock[(it.code||'').trim()]||{}).cost)}));

  if(dupBlock(d,items))return;

  const own=ownerRole(e),r={exp:z(),sal:{usd:on&&!own?nv(e.usd):0,syp:on&&!own?nv(e.syp):0},ot:z(),late:z(),unp:z(),cut:z(),adv:z(),draw:z(),paid:z(),days:0,rows:[]};
  for(const l of e.log||[]){if(l.type==='pay'){if(l.w===ws){r.paid.usd+=nv(l.usd);r.paid.syp+=nv(l.syp);r.rows.push(l)}continue}
    if(l.d<ws||l.d>we)continue;r.rows.push(l);
    if(l.type==='ot')r.ot[l.cur]+=nv(l.a);else if(l.type==='late')r.late[l.cur]+=nv(l.a);else if(l.type==='advcut')r.cut[l.cur]+=nv(l.a);else if(l.type==='draw')r.draw[l.cur]+=nv(l.a);else if(l.type==='exp')r.exp[l.cur]+=nv(l.a);else if(l.type==='adv')r.adv[l.cur]+=nv(l.a);else if(l.type==='leave'&&!l.paid)r.days+=nv(l.days)}
  for(const c of['usd','syp']){r.ot[c]=r2(r.ot[c]);r.late[c]=r2(r.late[c]);r.cut[c]=r2(r.cut[c]);r.draw[c]=r2(r.draw[c]);r.exp[c]=r2(r.exp[c]);r.adv[c]=r2(r.adv[c]);r.paid[c]=r2(r.paid[c]);r.unp[c]=r2(Math.min(r.days,WD)*r.sal[c]/WD)}

function cropClamp(){const C=S.crop,W=C.im.naturalWidth*C.s,H=C.im.naturalHeight*C.s;C.ox=Math.min(0,Math.max(CV-W,C.ox));C.oy=Math.min(0,Math.max(CV-H,C.oy))}
function cropOpen(file){const u=URL.createObjectURL(file),im=new Image();im.onerror=()=>{URL.revokeObjectURL(u);toast('تعذّرت قراءة الصورة، جرّب صورة أخرى')};
  im.onload=()=>{URL.revokeObjectURL(u);const s0=CV/Math.min(im.naturalWidth,im.naturalHeight);S.crop={im,s0,s:s0,ox:(CV-im.naturalWidth*s0)/2,oy:(CV-im.naturalHeight*s0)/2};
    const box=$('#e-crop');if(!box)return;box.hidden=false;$('#crop-z').value=1;cropDraw();
    const cv=$('#crop-cv');let drag=null;
    cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox:S.crop.ox,oy:S.crop.oy};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing'};
    cv.onpointermove=e=>{if(!drag||!S.crop)return;const k=CV/cv.getBoundingClientRect().width;S.crop.ox=drag.ox+(e.clientX-drag.x)*k;S.crop.oy=drag.oy+(e.clientY-drag.y)*k;cropClamp();cropDraw()};
    cv.onpointerup=cv.onpointercancel=()=>{drag=null;cv.style.cursor='grab'};box.scrollIntoView({block:'nearest'})};
  im.src=u}
function cropZoom(z){const C=S.crop;if(!C)return;const cx=(CV/2-C.ox)/C.s,cy=(CV/2-C.oy)/C.s;C.s=C.s0*z;C.ox=CV/2-cx*C.s;C.oy=CV/2-cy*C.s;cropClamp();cropDraw()}
function cropDone(){const C=S.crop;if(!C)return;const o=document.createElement('canvas');o.width=o.height=260;o.getContext('2d').drawImage(C.im,-C.ox/C.s,-C.oy/C.s,CV/C.s,CV/C.s,0,0,260,260);S.ephoto=o.toDataURL('image/jpeg',0.85);const p=$('#e-prev');if(p)p.src=S.ephoto;S.crop=null;const b=$('#e-crop');if(b)b.hidden=true;const f=$('#e-photo');if(f)f.value=''}

async function saveLog(){const f=S.lf,e=emp(S.eid);if(!f||!e)return;const l={id:newId(),type:f.type,d:f.d||today(),n:(f.n||'').trim()};
  if(f.type==='leave'){l.kind=f.kind;l.paid=String(f.paid)==='true';l.days=nv(f.days);if(!(l.days>0)){toast('أدخل عدد الأيام');return}}
  else if(f.type==='hot'||f.type==='hlate'){l.h=Math.round(nv(f.h)*100)/100;if(!(l.h>0)){toast('أدخل عدد الساعات');return}if(!l.n)l.n=fh(l.h)+(f.tm?(f.type==='hot'?' · خرج ':' · حضر ')+f.tm:'')}
  else{l.cur=f.cur;l.a=r2(nv(f.a));if(!(l.a>0)){toast('أدخل المبلغ');return}if(nv(f.h)>0){l.h=nv(f.h);if(!l.n)l.n=(Math.round(l.h*100)/100)+' ساعة'+(f.tm?(f.type==='ot'?' · خرج ':' · حضر ')+f.tm:'')}}

  if((f.type==='adv'||f.type==='exp')&&String(f.cashout)==='true')l.cash=l.d;
  await S.db.doc('staff/'+e.id).update({log:[...(e.log||[]),l]});

  S.lf=null;closeSheet();toast(l.cash?'سُجّل وخرج من الصندوق':'سُجّلت')}

const repStale=()=>!S.rep.inv||!S.rep.cash||S.rep.dirty||Date.now()-(S.rep.at||0)>60000;
function loadReports(force){if(!S.db||S.rep.loading)return;if(!force&&S.rep.inv&&S.rep.cash)return;S.rep.dirty=false;S.rep.loading=true;S.rep.err=false;staffSub();

    S.rep.inv=a.docs.map(d=>({id:d.id,...d.data()}));S.rep.cash=b.docs.map(d=>({id:d.id,...d.data()}));S.rep.loading=false;S.rep.at=Date.now();if(S.view==='reports')renderReports();if(S.view==='sales')renderSales();if(S.view==='exp'&&$('#scrim').hidden)refresh()

function repRange(per){const t=today();if(per==='day')return[t,t];if(per==='week'){const w=wkStart(t);return[w,addDays(w,6)]}if(per==='month')return[t.slice(0,7)+'-01',t.slice(0,7)+'-31'];return['0000-00-00','9999-99-99']}
function staffLogType(){const m={};for(const e of S.staff)for(const l of e.log||[])m[l.id]=l.type;return m}
function expCat(t,lt){if(t.dir!=='out'||t.pair||t.cid||t.wd||t.rv||t.rev||t.xfer||t.sup||t.asset)return null;
  if(t.staff||t.ltx){const k=lt[t.ltx]||((t.n||'').startsWith('سلفة')?'adv':(t.n||'').startsWith('مصروف')?'exp':'pay');return k==='adv'?'adv':k==='exp'?'own':'sal'}return'oth'}
function repCalc(lo,hi){const R=S.rep,lt=staffLogType(),o={sales:0,cashSales:0,credit:0,profit:0,cogs:0,ret:0,n:0,noCost:0,exp:{sal:0,own:0,oth:0,adv:0},pt:{staff:0,cust:0,owner:0},wd:0,noRate:false};
  for(const v of R.inv){if(v.void)continue;for(const r of v.rets||[]){if(r.void||(r.date||'')<lo||(r.date||'')>hi)continue;const rt=nv(r.total);o.ret+=rt;o.sales-=rt;if(PAID.includes(v.pay))o.cashSales-=rt;else o.credit-=rt;if(v.profit!=null){o.profit-=nv(r.profit);o.cogs-=nv(r.cost)}}
    const d=v.date||'';if(d<lo||d>hi)continue;o.n++;o.sales+=nv(v.total);if(PAID.includes(v.pay))o.cashSales+=nv(v.total);else o.credit+=nv(v.total);if(v.profit==null)o.noCost++;else{o.profit+=nv(v.profit);o.cogs+=nv(v.costTotal)}}
  for(const day of R.cash){const d=day.id||day.date||'';if(d<lo||d>hi)continue;const rate=nv(day.rate)||nv(S.settings.rate);
    for(const t of day.tx||[]){if(t.wd&&t.dir==='out'){o.wd+=t.cur==='usd'?nv(t.a):rate>0?nv(t.a)/rate:0;if(t.cur!=='usd'&&!(rate>0))o.noRate=true;continue}const c=expCat(t,lt);if(!c)continue;let u=t.cur==='usd'?nv(t.a):rate>0?nv(t.a)/rate:0;if(t.cur!=='usd'&&!(rate>0))o.noRate=true;o.exp[c]+=u;if(t.party&&o.pt[t.party]!==undefined)o.pt[t.party]+=u}}
  for(const e of (S.F&&S.F.exp)||[]){if(e.void||(e.date||'')<lo||(e.date||'')>hi)continue;const k=e.cat==='sal'?'sal':e.cat==='own'?'own':'oth';o.exp[k]+=nv(e.usd)}
  o.expTot=o.exp.sal+o.exp.own+o.exp.oth;return o}
function renderReports(){const el=$('#v-reports'),R=S.rep;
  if(!S.db){el.innerHTML='<div class="empty">جارٍ التحميل…</div>';return}

  const [lo,hi]=repRange(R.per),c=repCalc(lo,hi),T=today(),per={day:'اليوم',week:'هذا الأسبوع',month:'هذا الشهر',all:'الكل'};

  const net=r2(c.profit-c.expTot);
  // safe daily spending: average gross profit per working day (Sat-Thu) over the last 30 days
  const firstD=R.inv.reduce((m,v)=>v.date&&v.profit!=null&&(!m||v.date<m)?v.date:m,''),from=addDays(T,-29),st=firstD&&firstD>from?firstD:from;
  let wd=0;for(let d=st;d<=T;d=addDays(d,1)){if(new Date(d+'T12:00:00').getDay()!==5)wd++}wd=Math.max(wd,1);
  const w=repCalc(st,T),avgP=r2(w.profit/wd),avgOper=r2((w.exp.sal+w.exp.oth)/wd),avgExp=r2(w.expTot/wd),own=r2(avgP-avgOper),td=repCalc(T,T);
  const ok=avgExp<=avgP+0.005;
  const inv=R.inv.filter(v=>{const q=nrm(R.q);return!q||nrm(v.no).includes(q)||nrm(v.cname).includes(q)||String(v.total).includes(q)}).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||String(b.no).localeCompare(String(a.no),'en',{numeric:true}));
  el.innerHTML=`<div class="sechead"><h2>المبيعات والمصاريف</h2><button class="btn sm" type="button" data-act="rep-reload">تحديث</button></div>${seg}
   <div class="ctab" style="grid-template-columns:1.6fr 1fr"><span class="h">${per[R.per]}</span><span class="h"></span>

/* cash entries are never wiped: a voided entry stays, marked, and an opposite entry is booked today,
   so a day that was already counted and closed keeps its numbers */
const isCxl=t=>!!(t.rv||t.rev);
async function cashVoidTx(day,id,why){if(!lockGuard(day,today()))return false;const {ref,v}=await cashDay(day,false);if(!v)return false;const t0=v.tx.find(t=>t.id===id);if(!t0||t0.rv||t0.rev)return false;
  const grp=t0.pair?v.tx.filter(t=>t.pair===t0.pair):[t0],now=new Date().toISOString(),T=today(),revs=[];
  v.tx=v.tx.map(t=>grp.some(g=>g.id===t.id)?{...t,rv:{at:now,why}}:t);
  for(const g of grp)revs.push({id:newId(),t:now,dir:g.dir==='in'?'out':'in',cur:g.cur,a:g.a,n:'عكس: '+(g.n||''),rev:g.id,rvd:day,why});
  if(day===T){v.tx.push(...revs);v.closed=null;await ref.set(v);if(S.cday===day){S.cash=v}}
  else{await ref.set(v);if(S.cday===day)S.cash=v;await cashAdd(T,revs)}
  audit('cash-void','إلغاء حركة صندوق',{n:t0.n,a:t0.a,cur:t0.cur,day,why});if(S.view==='cash')refresh();return true}
/* the reversal for a cash entry that belongs to a customer ledger line (payment / cash invoice) */
async function cashVoidLinked(day,pred,why){const {ref,v}=await cashDay(day,false);if(!v)return;const L=v.tx.filter(t=>pred(t)&&!t.rv&&!t.rev);if(!L.length)return;const now=new Date().toISOString(),T=today();
  v.tx=v.tx.map(t=>L.some(g=>g.id===t.id)?{...t,rv:{at:now,why}}:t);const revs=L.map(g=>({id:newId(),t:now,dir:g.dir==='in'?'out':'in',cur:g.cur,a:g.a,n:'عكس: '+(g.n||''),rev:g.id,rvd:day,why}));
  if(day===T){v.tx.push(...revs);v.closed=null;await ref.set(v);if(S.cday===day)S.cash=v}else{await ref.set(v);if(S.cday===day)S.cash=v;await cashAdd(T,revs)}}

   6) أعمار الديون وسقف الدين
   ===================================================================== */
/* payments settle the oldest invoices first (FIFO); what is left open is aged by its date */
function ageCalc(tx){const T=today(),deb=[];let cr=0;for(const t of tx||[]){if(t.void)continue;if(t.k==='inv')deb.push({d:t.d||T,a:nv(t.a)});else cr+=nv(t.a)}
  deb.sort((a,b)=>a.d.localeCompare(b.d));const b=[0,0,0,0];let oldest=0;
  for(const x of deb){const use=Math.min(cr,x.a);cr=r2(cr-use);const rem=r2(x.a-use);if(rem<=0.005)continue;const days=Math.max(0,ddiff(T,x.d));oldest=Math.max(oldest,days);b[days<=30?0:days<=60?1:days<=90?2:3]+=rem}
  return{b:b.map(r2),oldest}}
function custCache(tx){const bal=r2((tx||[]).reduce((s,t)=>s+eff(t),0));return{balance:bal,age:bal>0.005?ageCalc(tx).oldest:0}}
const ageChip=c=>{const b=nv(c.balance);if(!(b>0.005))return'';const a=nv(c.age),lim=nv(c.limit);let h='';if(a>90)h+=`<span class="chip c-debt">متأخر +90 يوم</span>`;else if(a>60)h+=`<span class="chip c-due">+60 يوم</span>`;if(lim>0&&b>lim+0.005)h+=`<span class="chip c-debt">تجاوز السقف</span>`;return h};

    for(const d of sn.docs){const c=cust(d.id);if(!c||c.walkin)continue;const tx=d.data().tx||[],cc=custCache(tx);if(!(cc.balance>0.005))continue;const a=ageCalc(tx);a.b.forEach((v,i)=>tot[i]+=v);rows.push({c,bal:cc.balance,...a});
      if(nv(c.age)!==cc.age||Math.abs(nv(c.balance)-cc.balance)>0.005){try{await S.db.doc('customers/'+c.id).update(cc);Object.assign(c,cc)}catch(e){}}}

  let t=list.find(x=>x.id===txid);if(!t)return;openSheet(`<h2>🧾 سند قبض · ${esc(c.name)}</h2><div id="stmtbox" class="empty">جارٍ تجهيز السند…</div>`);
  if(!t.rno&&!t.void){try{const no=await finSeq('r'),f=await freshDoc('ledgers/'+cid),L=f.ok&&f.v?(f.v.tx||[]):list,nl=L.map(x=>x.id===txid?{...x,rno:no}:x);await S.db.doc('ledgers/'+cid).set({tx:nl});if(S.cid===cid)S.ledger=nl;t={...t,rno:no};list=nl}catch(e){}}
  let run=0;for(const x of list){run=r2(run+eff(x));if(x.id===txid)break}
  const m=/(\d[\d,.]*)\s*ل\.س على سعر\s*([\d,.]+)/.exec(t.n||''),raw=m?nv(m[1].replace(/,/g,'')):0,rate=m?nv(m[2].replace(/,/g,'')):0;
  const cv=await drawVoucher({kind:'r',no:t.rno,date:t.d,party:c.name,usd:t.a,cur:raw?'syp':'usd',raw,rate,method:t.via==='sham'?'شام كاش':t.cash?'نقداً (الصندوق)':t.k==='ret'?'مرتجع بضاعة':t.k==='disc'?'حسم':'تحويل / خارج الصندوق',note:(t.ref?'فاتورة رقم '+t.ref+' · ':'')+(t.n||'دفعة على الحساب'),bal:run,void:t.void});
  outBox(cv,'سند قبض '+(t.rno||'')+' '+c.name)}
async function pvchOpen(o){openSheet(`<h2>🧾 سند صرف</h2><div id="stmtbox" class="empty">جارٍ تجهيز السند…</div>`);const cv=await drawVoucher({kind:'p',...o});outBox(cv,'سند صرف '+(o.no||''))}

/* =====================================================================
   3) المرتجع: يرجع للمخزون ويصحح الحساب والربح
   ===================================================================== */
const retQty=(inv,code)=>(inv.rets||[]).filter(r=>!r.void).reduce((a,r)=>a+(r.items||[]).filter(i=>ck(i)===code).reduce((s,i)=>s+nv(i.qty),0),0);
function retSheet(){const inv=S.curInv,c=cust(S.cid);if(!inv||!c)return;if(inv.void){toast('الفاتورة ملغاة');return}
  const items=(inv.items||[]).map((it,i)=>({i,code:ck(it),name:it.name,unit:it.unit,price:nv(it.price),cost:nv(it.cost),sold:nv(it.qty),done:retQty(inv,ck(it))})).filter(x=>x.sold-x.done>0);
  if(!items.length){toast('كل مواد هالفاتورة مرجّعة');return}
  S.F.rf={items,q:{},wh:inv.wh||'main',refund:PAID.includes(inv.pay)||c.walkin?'cash':'acc',cur:'usd',rate:curRate()||'',date:today(),n:''};retRender()}
function retTotals(){const f=S.F.rf,inv=S.curInv,dp=1-discPct(inv)/100;let tot=0,cost=0,n=0;for(const x of f.items){const q=Math.min(nv(f.q[x.i]),x.sold-x.done);if(q>0){n++;tot+=q*x.price*dp;cost+=q*x.cost}}return{tot:r2(tot),cost:r2(cost),profit:r2(tot-cost),n}}
function retRender(){const f=S.F.rf,inv=S.curInv,c=cust(S.cid),T=retTotals(),sg=(k,v,l)=>`<button type="button" data-act="f-rf" data-k="${k}" data-v="${v}" aria-pressed="${f[k]===v}">${l}</button>`;
  openSheet(`<h2>↩️ إرجاع بضاعة · فاتورة ${esc(inv.no)}</h2><span class="small muted">اكتب الكمية اللي رجعت من كل مادة. بترجع للمستودع، وبتنشال قيمتها من حساب الزبون، وبينقص ربح الفاتورة.</span><form id="retform">
   <div class="list">${f.items.map(x=>`<div class="row"><span class="who"><b>${esc(x.name||x.code)}</b><small><span class="num">${esc(x.code)}</span><span>مباع <b class="num">${f1(x.sold)}</b></span>${x.done?`<span>رجع قبل <b class="num">${f1(x.done)}</b></span>`:''}<span class="num">× ${pr(x.price)}</span></small></span><input data-rq="${x.i}" type="number" step="any" min="0" max="${x.sold-x.done}" inputmode="decimal" value="${esc(f.q[x.i]||'')}" placeholder="0" aria-label="الكمية المرتجعة" style="width:84px;text-align:center;border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--bg)"></div>`).join('')}</div>
   ${discPct(inv)>0?`<span class="small muted">الفاتورة عليها حسم ${f1(discPct(inv))}%، والمرتجع محسوب بعد الحسم.</span>`:''}
   ${S.wh.length>1?`<div class="field"><label for="rf-wh">ترجع البضاعة لمستودع</label><select id="rf-wh" data-rff="wh">${whOpts(f.wh)}</select></div>`:''}
   <div class="field"><label>قيمة المرتجع</label><div class="seg">${c.walkin?'':sg('refund','acc','تنخصم من حساب الزبون')}${sg('refund','cash','ردّ المبلغ نقداً من الصندوق')}</div></div>
   ${f.refund==='cash'?`<div class="seg">${sg('cur','usd','رديت دولار')}${sg('cur','syp','رديت ليرة')}</div>${f.cur==='syp'?`<div class="field"><label for="rf-rate">سعر الصرف</label><input id="rf-rate" data-rff="rate" type="number" step="any" min="0" inputmode="decimal" value="${esc(f.rate)}"></div>`:''}`:''}
   <div class="field"><label for="rf-n">ملاحظة (اختياري)</label><input id="rf-n" data-rff="n" value="${esc(f.n)}" placeholder="مثال: كسر بالشحن"></div>
   <div class="totbar"><span>قيمة المرتجع · <span id="rf-cnt">${T.n}</span> مادة</span><b id="rf-tot">${money(T.tot)}</b></div>
   <span class="small muted" id="rf-hint">${f.refund==='cash'?'بيطلع المبلغ من الصندوق اليوم وبيتسجل بحساب الزبون.':'بينقص دين الزبون بقيمة المرتجع.'}</span>
   <div class="grid2"><button class="btn primary" type="submit">حفظ المرتجع</button><button class="btn" type="button" data-act="f-ret-back">رجوع</button></div></form>`)}
async function saveRet(){const f=S.F.rf,inv0=S.curInv,c=cust(S.cid);if(!f||!inv0||!c)return;const T=retTotals();if(!T.n||!(T.tot>0)){toast('اكتب كمية مادة وحدة على الأقل');return}
  const d=today();if(!lockGuard(d))return;let rate=0;if(f.refund==='cash'&&f.cur==='syp'){rate=nv(f.rate);if(!(rate>0)){toast('أدخل سعر الصرف');return}}
  const s=await S.db.doc('invoices/'+inv0.id).get();if(!s.exists)return;const inv={id:inv0.id,...s.data()};if(inv.void){toast('الفاتورة ملغاة');return}
  const dp=1-discPct(inv)/100,items=[];for(const x of f.items){const q=Math.min(nv(f.q[x.i]),nv((inv.items||[])[x.i]&&inv.items[x.i].qty)-retQty(inv,x.code));if(q>0)items.push({code:x.code,name:x.name,unit:x.unit,qty:r4(q),price:x.price,cost:x.cost})}
  if(!items.length){toast('الكميات أكبر من المتبقي');return}
  const tot=r2(items.reduce((a,i)=>a+i.qty*i.price*dp,0)),cost=r2(items.reduce((a,i)=>a+i.qty*i.cost,0)),rid=newId(),wh=f.wh||inv.wh||'main';
  const ret={id:rid,date:d,items,total:tot,cost,profit:inv.profit==null?null:r2(tot-cost),wh,refund:f.refund,n:(f.n||'').trim(),at:new Date().toISOString()};
  await S.db.doc('invoices/'+inv.id).set({...s.data(),rets:[...(inv.rets||[]),ret]});
  const lines=[{id:newId(),k:'ret',a:tot,d,ref:String(inv.no),n:'مرتجع فاتورة '+inv.no+' · '+items.length+' مادة'+(ret.n?' · '+ret.n:''),rinv:inv.id,rid}];
  if(f.refund==='cash')lines.push({id:newId(),k:'inv',a:tot,d,ref:String(inv.no),n:'ردّ نقدي لمرتجع فاتورة '+inv.no,rinv:inv.id,rid,cash:d});
  const fr=await freshDoc('ledgers/'+c.id),L=fr.ok&&fr.v?(fr.v.tx||[]):(S.ledger||[]),nl=[...L,...lines];await S.db.doc('ledgers/'+c.id).set({tx:nl});await S.db.doc('customers/'+c.id).update(custCache(nl));S.ledger=nl;Object.assign(c,custCache(nl));
  if(f.refund==='cash'){const a=f.cur==='syp'?Math.round(tot*rate):tot;await cashAdd(d,{id:newId(),t:new Date().toISOString(),dir:'out',cur:f.cur,a,n:'ردّ مرتجع فاتورة '+inv.no+' · '+c.name+(f.cur==='syp'?' (على سعر '+rate.toLocaleString('en-US')+')':''),cid:c.id,cname:c.name,ltx:lines[1].id,usd:tot,retof:inv.id})}
  const st={...S.stock};for(const i of items)if(i.code&&(S.products[i.code]||st[i.code]))addW(st,i.code,wh,i.qty);await saveStock(st);
  await addLog(items.filter(i=>i.code).map(i=>({t:new Date().toISOString(),code:i.code,kind:'ret',d:i.qty,q:nv((S.stock[i.code]||{}).q),w:wh})));
  S.invStats=null;if(S.rep.inv){const r=S.rep.inv.find(v=>v.id===inv.id);if(r)r.rets=[...(r.rets||[]),ret]}
  audit('ret-add','مرتجع بضاعة',{no:inv.no,c:c.name,total:tot,refund:f.refund==='cash'?'نقدي':'من الحساب'});S.F.rf=null;toast('انحفظ المرتجع: رجعت البضاعة للمستودع'+(f.refund==='cash'?' وطلع المبلغ من الصندوق':' وانخصمت قيمته من الحساب'));invView(inv.id)}
async function retVoid(rid,why){const inv0=S.curInv,c=cust(S.cid);if(!inv0||!c)return;const s=await S.db.doc('invoices/'+inv0.id).get();if(!s.exists)return;const d=s.data(),r=(d.rets||[]).find(x=>x.id===rid);if(!r||r.void)return;
  if(!lockGuard(r.date))return;const vd={at:new Date().toISOString(),why};await S.db.doc('invoices/'+inv0.id).set({...d,rets:d.rets.map(x=>x.id===rid?{...x,void:vd}:x)});
  const fr=await freshDoc('ledgers/'+c.id),L=fr.ok&&fr.v?(fr.v.tx||[]):(S.ledger||[]),mine=L.filter(t=>t.rid===rid&&!t.void),nl=L.map(t=>t.rid===rid&&!t.void?{...t,void:vd}:t);
  await S.db.doc('ledgers/'+c.id).set({tx:nl});await S.db.doc('customers/'+c.id).update(custCache(nl));S.ledger=nl;Object.assign(c,custCache(nl));
  for(const t of mine)if(t.cash)await cashVoidLinked(t.cash,x=>x.ltx===t.id,why);
  const st={...S.stock};for(const i of r.items||[])if(i.code&&(S.products[i.code]||st[i.code]))addW(st,i.code,r.wh||'main',-nv(i.qty));await saveStock(st);
  S.invStats=null;if(S.rep.inv){const x=S.rep.inv.find(v=>v.id===inv0.id);if(x)x.rets=d.rets.map(z=>z.id===rid?{...z,void:vd}:z)}
  audit('ret-void','إلغاء مرتجع',{no:d.no,c:c.name,total:r.total,why});toast('أُلغي المرتجع');invView(inv0.id)}
const retsHTML=inv=>{const R=inv.rets||[];if(!R.length)return'';return`<div class="card"><b>↩️ المرتجعات على هالفاتورة</b><div class="list">${R.map(r=>`<div class="row" style="${r.void?'opacity:.6':''}"><span class="who"><b>${r.void?'<s>':''}${dmy(r.date)} · ${(r.items||[]).map(i=>esc(i.name||i.code)+' × '+f1(i.qty)).join('، ')}${r.void?'</s>':''}</b><small><span>${r.refund==='cash'?'ردّ نقدي':'من الحساب'}</span>${r.n?`<span>${esc(r.n)}</span>`:''}${r.void?`<span class="chip c-debt">ملغى: ${esc(r.void.why||'')}</span>`:''}</small></span><span class="amt"><b class="t-credit">−${money(nv(r.total))}</b></span>${r.void||!isOwner()?'':`<button class="btn sm danger" type="button" data-act="f-ret-void" data-id="${esc(r.id)}">إلغاء</button>`}</div>`).join('')}</div></div>`};

async function maccAdd(m){const id=newId(),rec={...m,at:new Date().toISOString()};await S.db.doc('macc/'+id).set(rec);(S.F.macc=S.F.macc||[]).push({id,...rec});return id}
async function maccVoidLink(link,why){if(!S.F.macc){try{const s=await S.db.collection('macc').get();S.F.macc=s.docs.map(d=>({id:d.id,...d.data()}))}catch(e){return}}
  for(const m of S.F.macc.filter(x=>x.link===link&&!x.void)){const {id,...d}=m;d.void={at:new Date().toISOString(),why};await S.db.doc('macc/'+id).set(d);m.void=d.void}}
function accBal(id){const a=accOf(id),b={usd:nv((a.open||{}).usd),syp:nv((a.open||{}).syp)};for(const m of S.F.macc||[]){if(m.void||m.acc!==id)continue;b[m.cur]=r2(b[m.cur]+(m.dir==='in'?1:-1)*nv(m.a))}return b}
const balTxt=b=>[b.usd||!b.syp?money(b.usd):'',b.syp?sy(b.syp):''].filter(Boolean).join(' + ');
function accStrip(){if(!isOwner())return'';return`<div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:2px">${accs().map(a=>{const b=accBal(a.id);return`<button class="btn sm" type="button" data-act="f-acc" data-id="${esc(a.id)}" style="flex:none;flex-direction:column;align-items:flex-start;gap:0;padding:7px 12px"><span class="small muted">${esc(a.i)} ${esc(a.name)}</span><b class="num pv">${S.F.macc?balTxt(b):'…'}</b></button>`}).join('')}<button class="btn sm" type="button" data-act="f-accs" style="flex:none">⚙︎ الحسابات</button></div>`}
function accSheet(id){const a=accOf(id),b=accBal(id),L=(S.F.macc||[]).filter(m=>m.acc===id).sort((x,y)=>String(y.at||y.date).localeCompare(String(x.at||x.date)));S.F.accId=id;
  openSheet(`<h2>${esc(a.i)} ${esc(a.name)}</h2><div class="ctab"><span class="h"></span><span class="h">دولار</span><span class="h">ليرة سورية</span><span class="l t">الرصيد الحالي</span><span class="n t">${money(b.usd)}</span><span class="n t">${sy(b.syp)}</span></div>
   <div class="grid2"><button class="btn primary" type="button" data-act="f-mv" data-dir="in">＋ إيداع / قبض</button><button class="btn" type="button" data-act="f-mv" data-dir="out">− سحب / دفع</button><button class="btn sm" type="button" data-act="f-mv" data-dir="fromcash">تحويل من الصندوق إليه</button><button class="btn sm" type="button" data-act="f-mv" data-dir="tocash">تحويل منه إلى الصندوق</button></div>

   <div class="sechead"><h2>الحركات</h2><small>${L.length}</small></div>${L.length?`<div class="list">${L.slice(0,120).map(m=>`<button class="row" type="button" data-act="f-mv-open" data-id="${esc(m.id)}" style="${m.void?'opacity:.55':''}"><span class="who"><b>${m.void?'<s>':''}${esc(m.n||'')}${m.void?'</s>':''}</b><small><span class="num">${dmy(m.date)}</span>${m.void?`<span class="chip c-debt">ملغاة</span>`:''}</small></span><span class="amt"><b class="${m.dir==='in'?'t-credit':'t-debt'}">${m.dir==='in'?'+':'−'}${cm(m.cur,nv(m.a))}</b></span></button>`).join('')}</div>`:'<div class="empty">ما في حركات بعد.</div>'}
   <button class="btn" type="button" data-act="close">إغلاق</button>`)}

async function saveMv(){const f=S.F.mv,id=S.F.accId,a=r2(nv($('#mv-a').value)),n=$('#mv-n').value.trim(),xf=f.dir==='fromcash'||f.dir==='tocash',d=xf?today():($('#mv-d').value||today());if(!(a>0)){toast('أدخل المبلغ');return}if(!lockGuard(d))return;

const assetsL=()=>(Array.isArray(FM().assets)?FM().assets:[]).filter(a=>!a.void);
const depM=a=>nv(a.life)>0?r2((nv(a.cost)-nv(a.salv))/(nv(a.life)*12)):0;
const monthsBetween=(a,b)=>(+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7));
function assetNbv(a,at){const m=Math.max(0,Math.min(nv(a.life)*12,monthsBetween(a.date.slice(0,7),at.slice(0,7))));return r2(Math.max(nv(a.salv),nv(a.cost)-depM(a)*m))}
function depFor(lo,hi){let t=0;for(const a of assetsL()){const n=nv(a.life)*12;if(!(n>0))continue;const st=a.date.slice(0,7);let m=lo.slice(0,7);const he=hi.slice(0,7);let guard=0;while(m<=he&&guard++<240){const k=monthsBetween(st,m);if(k>=1&&k<=n)t+=depM(a);m=addMonths(m,1)}}return r2(t)}
function plCalc(lo,hi){const c=repCalc(lo,hi),E=expRows(lo,hi),bc=byCat(E),dep=depFor(lo,hi),exp=sumUsd(E);
  return{sales:r2(c.sales),ret:r2(c.ret||0),cogs:r2(c.cogs||0),gross:r2(c.profit),noCost:c.noCost,bc,exp,dep,net:r2(c.profit-exp-dep),n:c.n}}

    ${row('= صافي الربح',P.net,P.net<0?'t-debt':'t-credit',true)}</div>
   ${P.noCost?`<span class="small muted">${P.noCost} فاتورة بدون تكلفة مسجلة ما دخلت بمجمل الربح.</span>`:''}<span class="small muted">صافي الربح هو اللي بقي فعلاً للشركة بعد كل المصاريف. إذا سالب، الشركة عم تخسر بهالفترة.</span></div>`}

/* SYP helper: every Syrian-pound field shows the amount in words (تفقيط) live, plus quick zero buttons */
/* old <-> new Syrian pound converter (100 old = 1 new) */
function fxOldNewSheet(){openSheet(`<h2>🔁 محوّل الليرة السورية</h2><div class="note">العملة الجديدة: كل <b>100 ليرة قديمة = 1 ليرة جديدة</b> (حذف صفرين).</div>
  <div class="field"><label for="on-old">بالليرة القديمة (ل.س)</label><input id="on-old" type="number" step="any" min="0" inputmode="decimal" data-syp="1"></div>
  <div class="field"><label for="on-new">بالليرة الجديدة</label><input id="on-new" type="number" step="any" min="0" inputmode="decimal"></div>
  <div class="note" id="on-out" style="display:none"></div>
  <button class="btn" type="button" data-act="close">إغلاق</button>`);
  const o=$('#on-old'),n=$('#on-new'),out=$('#on-out'),paint=()=>{const v=nv(o.value);out.style.display=v>0?'':'none';out.innerHTML=v>0?`<bdi dir="ltr" class="num"><b>${Math.round(v).toLocaleString('en-US')}</b></bdi> قديمة = <bdi dir="ltr" class="num"><b>${(v/100).toLocaleString('en-US',{maximumFractionDigits:2})}</b></bdi> جديدة<br><span class="small">${tafqit(Math.round(v/100))} ليرة جديدة</span>`:''};
  o.addEventListener('input',()=>{const v=nv(o.value);n.value=o.value===''?'':String(Math.round(v)/100);paint()});
  n.addEventListener('input',()=>{const v=nv(n.value);o.value=n.value===''?'':String(Math.round(v*100));tafqitPaint(o);paint()});o.focus()}
function tafqit(n){n=Math.floor(Math.abs(Number(n)||0));if(!n)return'صفر';
  const O=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'],
    T=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'],H=['','مئة','مئتان','ثلاثمئة','أربعمئة','خمسمئة','ستمئة','سبعمئة','ثمانمئة','تسعمئة'];
  const u1000=x=>{const h=Math.floor(x/100),r=x%100,p=[];if(h)p.push(H[h]);if(r){if(r<20)p.push(O[r]);else p.push(r%10?O[r%10]+' و'+T[Math.floor(r/10)]:T[Math.floor(r/10)])}return p.join(' و')};
  const SC=[[1e9,'مليار','ملياران','مليارات'],[1e6,'مليون','مليونان','ملايين'],[1e3,'ألف','ألفان','آلاف']],parts=[];
  for(const [v,one,two,few] of SC){const q=Math.floor(n/v);if(!q)continue;n%=v;parts.push(q===1?one:q===2?two:q<=10?u1000(q)+' '+few:u1000(q)+' '+one)}
  if(n)parts.push(u1000(n));return parts.join(' و')}
function isSypInput(el){if(!el||el.tagName!=='INPUT'||el.type!=='number'||!el.id)return false;if(el.dataset.syp)return true;const l=document.querySelector('label[for="'+el.id+'"]');return !!l&&/ل\.س|ليرة/.test(l.textContent)&&!/سعر/.test(l.textContent)}
function tafqitPaint(el){if(!isSypInput(el)){const o=el&&el.nextElementSibling;if(o&&o.classList&&o.classList.contains('tafqit'))o.remove();return}
  let box=el.nextElementSibling;if(!box||!box.classList.contains('tafqit')){box=document.createElement('div');box.className='tafqit';box.innerHTML='<span class="tw"></span><button type="button" data-z="000" tabindex="-1">+ 000</button><button type="button" data-z="000000" tabindex="-1">+ 000,000</button><button type="button" data-z="back" tabindex="-1">⌫ 000</button><button type="button" data-z="x100" tabindex="-1">جديدة ← قديمة (×100)</button><span class="tc small muted" style="flex:1 1 100%"></span>';el.after(box);
    box.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-z]');if(!b)return;e.preventDefault();let v=String(el.value||'').replace(/\D/g,'');if(b.dataset.z==='back')v=v.length>3?v.slice(0,-3):'';else if(b.dataset.z==='x100')v=v?String(Math.round(nv(el.value)*100)):'';else v=(v||'0')==='0'?'1'+b.dataset.z:v+b.dataset.z;el.value=v;el.dispatchEvent(new Event('input',{bubbles:true}));el.focus()})}
  const v=Math.floor(nv(el.value));if(box.dataset.v===String(v))return;box.dataset.v=String(v);box.querySelector('.tw').innerHTML=v>0?`<bdi class="tn num" dir="ltr">${v.toLocaleString('en-US')}</bdi> ل.س — ${tafqit(v)} ليرة سورية`:'اكتب المبلغ بالليرة، أو استعمل أزرار الأصفار';const tc=box.querySelector('.tc');if(tc)tc.innerHTML=v>0?`🔁 بالليرة الجديدة: <bdi dir="ltr" class="num" style="font-weight:700;color:var(--ink)">${(Math.round(v)/100).toLocaleString('en-US',{maximumFractionDigits:2})}</bdi> ل.س جديدة (كل 100 قديمة = 1 جديدة). إذا كتبت مبلغ بالجديدة اكبس «جديدة ← قديمة».`:''}
document.addEventListener('input',e=>{if(e.target&&e.target.type==='number')tafqitPaint(e.target)},true);
document.addEventListener('focusin',e=>{if(e.target&&e.target.type==='number')tafqitPaint(e.target)});
new MutationObserver(()=>{document.querySelectorAll('#sheet input[type=number]').forEach(el=>{if(isSypInput(el)||(el.nextElementSibling&&el.nextElementSibling.classList.contains('tafqit')))tafqitPaint(el)})}).observe(document.getElementById('sheet'),{childList:true,subtree:true});
</script>
